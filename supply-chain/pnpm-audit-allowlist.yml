# pnpm-audit suppression allowlist (sub-spec §5.3).
#
# scripts/pnpm-audit-with-allowlist.py reads this. Entries expire on `expires`
# (ISO date); expired entries stop suppressing the advisory.
#
# Example:
#   allowlist:
#     - advisory: "GHSA-xxxx-xxxx-xxxx"
#       package: "some-node-dep"
#       reason: "dev-only tooling; not shipped to the browser bundle"
#       accepted_by: "synthetic-approver"
#       expires: "2026-08-23"
#
# No live entries. GHSA-qwww-vcr4-c8h2 (react-router) expired on 2026-10-26.
# The terminal already depends on react-router 8.4.0, which is outside the
# affected range (>=8.0.0, <8.3.0 and >=7.12.0, <7.18.2), and pnpm audit no
# longer reports it. Do not renew that waiver. Earlier patched packages stay
# on the overrides in pnpm-workspace.yaml.
allowlist: []
