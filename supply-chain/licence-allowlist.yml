# AGPL licence-compatibility allowlist (sub-spec §7.3).
#
# Every SPDX identifier under `allowlist` is a flinttrade-permitted licence per §7.2
# of the supply-chain-security sub-spec. flinttrade itself is AGPL-3.0-or-later, so
# every dependency must be distributable under those terms.
#
# Additions require founder approval + a written rationale in the PR description that
# adds the entry. `scripts/check-broker-sdk-licences.py` and
# `scripts/check-transitive-licences.py` both read this file.
allowlist:
  - "AGPL-3.0-only"
  - "AGPL-3.0-or-later"
  - "GPL-3.0-only"
  - "GPL-3.0-or-later"
  - "GPL-2.0-or-later"      # only the "or later" variant; bare GPL-2.0-only is FORBIDDEN
  - "LGPL-3.0-or-later"
  - "MIT"
  - "MIT-0"
  - "BSD-2-Clause"
  - "BSD-3-Clause"
  - "ISC"
  - "Apache-2.0"
  - "MPL-2.0"
  - "Unlicense"
  - "0BSD"
  - "Python-2.0"            # required for cpython stdlib bindings (e.g. decimal/distutils-fork wheels)
  # Operator-cleared broker SDKs. FlintTrade is personal-use, self-hosted, single-
  # operator software (operator == user == data principal == the one running the
  # AGPL deployment). Broker API client SDKs are published by the brokers expressly
  # for their own customers to access their own accounts; the operator has
  # determined they are available for that use regardless of a missing or non-SPDX
  # upstream licence declaration. This LicenseRef is ONLY for such broker SDKs
  # pinned in brokers.lock (e.g. Kotak's neo-api-client, which ships no LICENSE
  # file) — NOT a blanket allowance: every non-broker dependency still needs a real
  # allowlisted SPDX licence above.
  - "LicenseRef-operator-cleared-broker-sdk"

# Explicit denylist for clarity. The gate is the positive allowlist check; this
# denylist is documentation AND a hard fail if a dep declares one of these.
denylist:
  - "GPL-2.0-only"
  - "SSPL-1.0"
  - "BUSL-1.1"
  - "Commons-Clause"
  - "Elastic-2.0"
  - "CC-BY-NC-4.0"
  - "CC-BY-NC-SA-4.0"
  - "CC-BY-ND-4.0"

# Fallbacks for malformed metadata; the script emits these as a soft warning
# (not a fail) so the founder can manually classify and either add to allowlist
# or open an upstream issue.
classification_review:
  - "UNKNOWN"
  - ""
  - "NOASSERTION"
