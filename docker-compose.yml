# =============================================================================
# FlintTrade Docker Compose — Production Deployment
# =============================================================================
#
# Usage:
#   docker compose up -d                  # start all services
#   docker compose up -d --build          # rebuild and start
#   docker compose logs -f flinttrade     # follow FlintTrade logs
#   docker compose down                   # stop all services
#
# Architecture:
#   Nginx (80/443) -> React static files + reverse proxy to backend services
#   OpenAlgo (5000/8765) -> Broker gateway + WebSocket market data
#   FlintTrade (5100) -> Platform backend (strategy engine, screener, AI)
#   Monitoring stack -> Uptime Kuma, Glitchtip, VictoriaLogs, Netdata
#
# All internal services bind to 127.0.0.1 only. Nginx is the sole entry point.
#
# Multi-arch builds:
#   All base images (python:3.12-slim, node:22-alpine, nginx:alpine, etc.) support
#   linux/amd64 and linux/arm64. To build the FlintTrade image for multiple platforms:
#     docker buildx build --platform linux/amd64,linux/arm64 -t flinttrade:latest .
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # OpenAlgo — Broker gateway (32 brokers), REST API + WebSocket
  # ---------------------------------------------------------------------------
  # NOTE: OpenAlgo is no longer bundled with FlintTrade. It is an external
  # service that users deploy separately. The block below is kept commented
  # as a reference for contributors who want to spin up a local-dev OpenAlgo
  # alongside FlintTrade — uncomment after running scripts/setup-test-deps.sh
  # to populate .local/external/openalgo/. Production deployments should
  # point FlintTrade at a separately-managed OpenAlgo via OPENALGO_HOST.
  #
  # openalgo:
  #   image: python:3.12-slim
  #   platform: linux/amd64
  #   container_name: flinttrade-openalgo
  #   working_dir: /app
  #   volumes:
  #     - ./.local/external/openalgo:/app:ro
  #     - openalgo_data:/app/db
  #   command: >
  #     bash -c "pip install -r requirements.txt --quiet &&
  #              gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:5000 app:app &
  #              python websocket_server.py &
  #              wait"
  #   ports:
  #     - "127.0.0.1:5000:5000"
  #     - "127.0.0.1:8765:8765"
  #   env_file:
  #     - .env
  #     - ./.local/external/openalgo/.env
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-sf", "http://localhost:5000/api/v1/ping"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 60s
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "50m"
  #       max-file: "5"
  #   networks:
  #     - flinttrade

  # ---------------------------------------------------------------------------
  # FlintTrade — Platform backend (strategy engine, screener, AI, data)
  # Multi-stage build with uv for fast dependency installation.
  # ---------------------------------------------------------------------------
  flinttrade:
    build:
      context: .
      dockerfile: Dockerfile
    image: flinttrade:latest
    platform: linux/amd64
    container_name: flinttrade-backend
    volumes:
      - flinttrade_data:/data/flinttrade
      - ${FLINTTRADE_HOME:-~/.flinttrade}:/home/flinttrade/.flinttrade
      - flinttrade_strategies:/data/flinttrade/strategies
      - flinttrade_logs:/data/flinttrade/logs
    ports:
      - "127.0.0.1:5100:5100"
    env_file: .env
    environment:
      - FLINTTRADE_DEV=0
      - FLINTTRADE_BACKEND_PORT=5100
      # OpenAlgo is external — set this to your OpenAlgo host. If you
      # uncomment the local-dev openalgo service above, use http://openalgo.
      - OPENALGO_HOST=${OPENALGO_HOST:-http://host.docker.internal}
      - OPENALGO_PORT=5000
      - OPENALGO_WS_PORT=8765
      - OPENBLAS_NUM_THREADS=2
      - OMP_NUM_THREADS=2
      - GUNICORN_WORKERS=1
      - GUNICORN_TIMEOUT=120
      - LOG_LEVEL=info
    # depends_on: openalgo — disabled because OpenAlgo is now an external
    # service. Re-enable if you uncomment the local-dev openalgo block above.
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=100M
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5100/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - flinttrade

  # ---------------------------------------------------------------------------
  # Terminal — Build React static files (builder only, no runtime container)
  # Nginx serves the built dist/ directory.
  #
  # This is a pnpm workspace (root pnpm-lock.yaml, no package-lock.json) and the
  # terminal imports @flinttrade/design-system via a file: path that lives
  # outside the terminal package, so the whole repo must be mounted and built
  # through the workspace. The commands mirror the node-core-tests job in
  # .github/workflows/test.yml: corepack enable, then a frozen-lockfile install,
  # then build the terminal package. Vite writes to the default dist/ inside the
  # terminal package, which is the path Nginx mounts via terminal_dist.
  # ---------------------------------------------------------------------------
  terminal:
    image: node:22-alpine
    platform: linux/amd64
    container_name: flinttrade-terminal-builder
    working_dir: /workspace
    volumes:
      - .:/workspace
      - terminal_dist:/workspace/packages/apps/terminal/dist
      - terminal_node_modules:/workspace/node_modules
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm --dir packages/apps/terminal run build"
    environment:
      - NODE_ENV=production
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - flinttrade

  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy and static file server (sole public entry point)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    platform: linux/amd64
    container_name: flinttrade-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/flinttrade.conf:/etc/nginx/conf.d/default.conf:ro
      - terminal_dist:/var/www/flinttrade/dist:ro
      - nginx_logs:/var/log/nginx
      # Uncomment when SSL certificates are provisioned:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      terminal:
        condition: service_completed_successfully
      flinttrade:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - flinttrade

  # ---------------------------------------------------------------------------
  # Uptime Kuma — Uptime monitoring dashboard
  # Internal only (proxied via Nginx at /monitoring/)
  # ---------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    platform: linux/amd64
    container_name: flinttrade-uptime-kuma
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - flinttrade

  # ---------------------------------------------------------------------------
  # Glitchtip — Error tracking (Sentry-compatible, MIT licence)
  # Internal only (proxied via Nginx at /errors/)
  # Requires PostgreSQL for storage + Celery worker for async processing
  # ---------------------------------------------------------------------------
  glitchtip-redis:
    image: redis:7-alpine
    platform: linux/amd64
    container_name: flinttrade-glitchtip-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - flinttrade

  glitchtip:
    image: glitchtip/glitchtip:latest
    platform: linux/amd64
    container_name: flinttrade-glitchtip
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      glitchtip-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:?Set GLITCHTIP_DB_PASSWORD in .env}@glitchtip-db:5432/glitchtip"
      SECRET_KEY: "${GLITCHTIP_SECRET_KEY:?Set GLITCHTIP_SECRET_KEY in .env}"
      CELERY_BROKER_URL: "redis://glitchtip-redis:6379/0"
      PORT: "8000"
      GLITCHTIP_DOMAIN: "http://127.0.0.1:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - flinttrade

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    platform: linux/amd64
    container_name: flinttrade-glitchtip-worker
    command: bin/run-celery-with-beat.sh
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:?Set GLITCHTIP_DB_PASSWORD in .env}@glitchtip-db:5432/glitchtip"
      SECRET_KEY: "${GLITCHTIP_SECRET_KEY:?Set GLITCHTIP_SECRET_KEY in .env}"
      CELERY_BROKER_URL: "redis://glitchtip-redis:6379/0"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - flinttrade

  glitchtip-db:
    image: postgres:16-alpine
    platform: linux/amd64
    container_name: flinttrade-glitchtip-db
    volumes:
      - glitchtip_pg:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: "${GLITCHTIP_DB_PASSWORD:?Set GLITCHTIP_DB_PASSWORD in .env}"
      POSTGRES_DB: glitchtip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - flinttrade

  # ---------------------------------------------------------------------------
  # VictoriaLogs — Log aggregation and search
  # Internal only (proxied via Nginx at /logs/)
  # ---------------------------------------------------------------------------
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    platform: linux/amd64
    container_name: flinttrade-victorialogs
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - victorialogs_data:/victoria-logs-data
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-httpListenAddr=:9090"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - flinttrade

  # ---------------------------------------------------------------------------
  # Netdata — Real-time system performance monitoring
  # Internal only (proxied via Nginx at /metrics/)
  # ---------------------------------------------------------------------------
  netdata:
    image: netdata/netdata:latest
    platform: linux/amd64
    container_name: flinttrade-netdata
    ports:
      - "127.0.0.1:19999:19999"
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - flinttrade

# =============================================================================
# Named volumes — persistent data across container restarts
# =============================================================================
volumes:
  # Core application
  openalgo_data:
    name: flinttrade_openalgo_data
  flinttrade_data:
    name: flinttrade_platform_data
  flinttrade_strategies:
    name: flinttrade_strategies
  flinttrade_logs:
    name: flinttrade_logs

  # Terminal build
  terminal_dist:
    name: flinttrade_terminal_dist
  terminal_node_modules:
    name: flinttrade_terminal_node_modules

  # Nginx
  nginx_logs:
    name: flinttrade_nginx_logs

  # Monitoring
  uptime_kuma_data:
    name: flinttrade_uptime_kuma_data
  glitchtip_pg:
    name: flinttrade_glitchtip_pg
  victorialogs_data:
    name: flinttrade_victorialogs_data
  netdata_config:
    name: flinttrade_netdata_config
  netdata_lib:
    name: flinttrade_netdata_lib
  netdata_cache:
    name: flinttrade_netdata_cache

# =============================================================================
# Internal network — all services communicate over this bridge
# =============================================================================
networks:
  flinttrade:
    name: flinttrade
    driver: bridge
