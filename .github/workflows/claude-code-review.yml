name: Claude Code Review

on:
  pull_request:
    # 2026-05-19: removed `synchronize` from the trigger list. Every PR
    # commit used to fire a Claude review; on a multi-commit PR that
    # billed Claude's runtime ~5–10× per PR. Now the review runs once
    # when the PR is opened / marked ready-for-review / reopened, and
    # the author can request an updated review by commenting `@claude`
    # (handled by claude.yml).
    types: [opened, ready_for_review, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.local/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'

# Only one Claude review per PR ref at a time.
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft != true
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

