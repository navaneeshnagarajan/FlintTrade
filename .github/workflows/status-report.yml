name: Status Report

on:
  schedule:
    - cron: '0 7 * * 1'   # Every Monday at 07:00 UTC
  workflow_dispatch:        # Allow manual trigger

# Least-privilege default: only reads the repo; the report is published as an artefact.
permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # NOTE: `submodules: recursive` was removed 2026-05-19. External services +
        # OpenClaw + AlgoMirror are no longer git submodules — they were
        # detached in commit 3da42e4 and live under `.local/external/`
        # (gitignored, provisioned separately when needed).
        # Trying to recursively check them out triggered noisy warnings
        # on every weekly run.

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --frozen          # SC-07: hash-verified install

      - name: Generate status report
        run: |
          mkdir -p .local/reference
          # absorption-status.json is local-only; create empty if absent
          if [ ! -f .local/reference/absorption-status.json ]; then
            echo '[]' > .local/reference/absorption-status.json
          fi
          uv run python scripts/audit_repos.py --format markdown > .local/STATUS.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status-report
          path: .local/STATUS.md
