name: Status Report

on:
  schedule:
    - cron: '0 7 * * 1'   # Every Monday at 07:00 UTC
  workflow_dispatch:        # Allow manual trigger

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # NOTE: `submodules: recursive` was removed 2026-05-19. OpenAlgo +
        # OpenClaw + AlgoMirror are no longer git submodules — they were
        # detached in commit 3da42e4 and live under `.local/external/`
        # (gitignored, cloned on demand via scripts/setup-test-deps.sh).
        # Trying to recursively check them out triggered noisy warnings
        # on every weekly run.

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate status report
        run: |
          mkdir -p .local/reference
          # absorption-status.json is local-only; create empty if absent
          if [ ! -f .local/reference/absorption-status.json ]; then
            echo '[]' > .local/reference/absorption-status.json
          fi
          python scripts/audit_repos.py --format markdown > .local/STATUS.md

      - uses: actions/upload-artifact@v4
        with:
          name: status-report
          path: .local/STATUS.md
