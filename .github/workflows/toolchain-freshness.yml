name: Toolchain freshness

# pnpm audit and pip-audit see published *packages*. Neither can see the
# toolchain binaries FlintTrade pins itself: the Node runtime and pnpm release
# the desktop bootstrap downloads, the uv build that provisions Python, and the
# floors and targets flint.toml declares. Those go stale in silence - there is no
# advisory feed for "the release line you pinned reached end of life".
#
# scripts/check-toolchain-freshness.py closes that gap against real upstream
# release data (nodejs.org/dist, the Node LTS/EOL schedule, the pnpm registry
# tags, uv's GitHub releases and the CPython EOL calendar), reading flint.toml
# [requirements] as the source of truth.
#
# It is offline-tolerant by construction: every source is fetched independently
# and an unreachable one is reported as skipped, so an upstream blip cannot
# redden an unrelated pull request. A non-zero exit here always means a version
# is genuinely EOL or out of the declared N-1 band.
#
# NOTE: the two `paths:` lists below are duplicated on purpose. GitHub Actions
# does not support YAML anchors/aliases, so `&name` / `*name` would make the
# workflow unparseable. Keep the lists in step.

on:
  schedule:
    # Weekly, Monday 05:30 UTC = 11:00 IST - the day after the vuln-snapshot
    # refresh, so the week starts with both dependency and toolchain drift known.
    - cron: '30 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'flint.toml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'packages/apps/desktop/resources/bootstrap/tool-manifest.json'
      - 'scripts/check-toolchain-freshness.py'
      - 'tests/test_toolchain_freshness.py'
      - '.github/workflows/toolchain-freshness.yml'
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, ready_for_review, reopened]
    # A pull request that moves a floor, a target or a bootstrap pin is exactly
    # when this has to run; the path filter keeps it off every other PR.
    paths:
      - 'flint.toml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'packages/apps/desktop/resources/bootstrap/tool-manifest.json'
      - 'scripts/check-toolchain-freshness.py'
      - 'tests/test_toolchain_freshness.py'
      - '.github/workflows/toolchain-freshness.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least-privilege token: read the repo, read public release feeds, print a report.
permissions:
  contents: read

concurrency:
  group: toolchain-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain-eol:
    name: Declared and pinned toolchain versions are supported
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Five small HTTP fetches and some date arithmetic. The cap is the runaway
    # guard against a hung connection the per-request timeout somehow survives.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      # Stdlib-only, so no uv sync: checkout plus an interpreter is the whole job.
      # --report writes the JSON alongside the human-readable log, so the
      # artefact costs no second round of upstream fetches.
      - name: Check toolchain EOL and N-1 band
        run: python scripts/check-toolchain-freshness.py --report toolchain-freshness.json
      # Warnings (a stale patch inside an in-band line, a dated waiver) do not
      # fail the job, so the report is the only place they survive the run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: toolchain-freshness-report
          path: toolchain-freshness.json
          retention-days: 30
          if-no-files-found: warn
