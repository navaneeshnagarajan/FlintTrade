name: Desktop Release

# Builds the native FlintTrade desktop installers for every supported OS /
# architecture and (on a version tag) attaches them to a GitHub Release.
#
#   • macOS    — .dmg + .app           (arm64 + Intel x64)
#   • Windows  — .exe (NSIS)           (x64)
#   • Linux    — .deb + .rpm + .AppImage (x64 + arm64)
#
# Each job freezes the Python backend into a sidecar (PyInstaller), then bundles
# it inside a Tauri 2 shell. See docs/DESKTOP.md and packaging/.
#
# Trigger: run manually (workflow_dispatch), optionally providing a release tag.
# Version-tag pushes are intentionally not used here because the matrix includes
# macOS and Windows runners; repo CI policy keeps expensive runners behind
# manual or scheduled execution only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish under (e.g. v0.6.0-beta.1). Leave blank to only upload build artifacts.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - label: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify release tag matches package version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_TAG=""
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG:-}" ]]; then
            RELEASE_TAG="$INPUT_TAG"
          fi

          if [[ -z "$RELEASE_TAG" ]]; then
            echo "No release tag supplied; building workflow artifacts only."
            exit 0
          fi

          TAG_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}" 2>/dev/null || true)"
          if [[ -n "$TAG_COMMIT" && "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Release tag $RELEASE_TAG points at $TAG_COMMIT, not this workflow run's commit $GITHUB_SHA." >&2
            echo "Create a fresh tag on the current main head before publishing installers." >&2
            exit 1
          fi

          VERSION="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -n 1)"
          DESKTOP_VERSION="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' packages/apps/desktop/package.json | head -n 1)"
          TAURI_VERSION="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' packages/apps/desktop/src-tauri/tauri.conf.json | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read package.json version." >&2
            exit 1
          fi
          if [[ "$DESKTOP_VERSION" != "$VERSION" || "$TAURI_VERSION" != "$VERSION" ]]; then
            echo "Release version mismatch: root=$VERSION desktop=$DESKTOP_VERSION tauri=$TAURI_VERSION." >&2
            exit 1
          fi
          case "$RELEASE_TAG" in
            "v$VERSION"|"v$VERSION"-*) ;;
            *)
              echo "Release tag $RELEASE_TAG does not match package.json version $VERSION." >&2
              echo "Use v$VERSION or v$VERSION-<suffix>, or bump package versions first." >&2
              exit 1
              ;;
          esac

      # --- Toolchains ----------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/apps/desktop/src-tauri -> target

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # --- Linux system dependencies for Tauri 2 -------------------------
      - name: Install Linux build dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libgtk-3-dev \
            build-essential \
            file

      # --- Python backend deps + PyInstaller -----------------------------
      - name: Install Python dependencies
        run: |
          # Desktop packaging excludes the optional numba/llvmlite ML stack;
          # macOS Intel has no compatible llvmlite wheel and must not build it.
          uv sync --frozen --extra desktop

      # --- Frontend deps + build -----------------------------------------
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build terminal frontend
        # Force base "/" so the bundle is never contaminated by a site-demo
        # build (base "/demo-app/"); the backend serves the SPA from the root.
        run: pnpm --filter @flinttrade/terminal build -- --base=/

      # --- Freeze the backend into a Tauri sidecar -----------------------
      - name: Build backend sidecar
        shell: bash
        env:
          SKIP_FRONTEND: '1'
          TARGET_TRIPLE: ${{ matrix.target }}
        run: bash packaging/build-backend.sh

      # --- Bundle the Tauri desktop app ----------------------------------
      - name: Build desktop installers
        shell: bash
        run: |
          BUNDLE_ARGS=()
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            # WiX/MSI rejects beta SemVer like 0.6.0-beta.1; NSIS produces the
            # Windows .exe installer without flattening the public version.
            BUNDLE_ARGS+=(--bundles nsis)
          fi
          pnpm --filter @flinttrade/desktop tauri build --target ${{ matrix.target }} "${BUNDLE_ARGS[@]}"

      # --- Collect installers --------------------------------------------
      - name: Stage installers
        id: stage
        shell: bash
        run: |
          OUT="dist-installers"
          mkdir -p "$OUT"
          BUNDLE="packages/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          # Copy every produced installer, ignoring missing per-OS types.
          find "$BUNDLE" -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} "$OUT/" \; 2>/dev/null || true
          COUNT="$(find "$OUT" -type f | wc -l | tr -d ' ')"
          if [ "$COUNT" -eq 0 ]; then
            echo "No installers were produced for ${{ matrix.label }} at $BUNDLE" >&2
            find "packages/apps/desktop/src-tauri/target" -maxdepth 5 -type f | sort >&2 || true
            exit 1
          fi
          echo "installer_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Installers staged:"; ls -lah "$OUT" || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flinttrade-desktop-${{ matrix.label }}
          path: dist-installers/*
          if-no-files-found: error

      # --- Attach to the GitHub Release when a release tag is supplied -----
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist-installers/*
          draft: true
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
