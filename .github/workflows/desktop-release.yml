name: Desktop Release

# Builds the four supported Electron installers. The application source and
# managed runtime are acquired and verified by the installed shell on first
# run, so these artefacts contain only Electron and its bootstrap resources.
#
# Trigger: release-please.yml dispatches this workflow after creating a tag,
# or a maintainer can dispatch it without a tag for build-only artefacts.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish under (e.g. v0.0.1). Leave blank to only upload build artifacts.'
        required: false
        default: ''
      expected_sha:
        description: 'Immutable 40-character commit SHA that the release tag must reference. Required when publishing.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify release tag matches package version
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${INPUT_TAG:-}"
          EXPECTED_SHA="${INPUT_EXPECTED_SHA:-}"
          SOURCE_SHA="$GITHUB_SHA"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ "$RELEASE_TAG" != v* || ! "${RELEASE_TAG#v}" =~ $SEMVER_RE ]]; then
              echo "Release tag is not valid SemVer: $RELEASE_TAG." >&2
              exit 1
            fi
            if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Publishing requires expected_sha to be an exact lowercase 40-character commit SHA." >&2
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
              echo "Tagged publication must dispatch the workflow from refs/tags/$RELEASE_TAG, not $GITHUB_REF." >&2
              exit 1
            fi
            if [[ "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
              echo "Release tag $RELEASE_TAG was dispatched for $GITHUB_SHA, not expected immutable commit $EXPECTED_SHA." >&2
              exit 1
            fi
            GUARD_REF="refs/flinttrade-release-validation/tag"
            if ! git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:$GUARD_REF"; then
              echo "Release tag $RELEASE_TAG does not exist in the remote repository." >&2
              exit 1
            fi
            TAG_COMMIT="$(git rev-parse --verify "$GUARD_REF^{commit}" 2>/dev/null || true)"
            if [[ -z "$TAG_COMMIT" ]]; then
              echo "Release tag $RELEASE_TAG does not exist in this checkout." >&2
              exit 1
            fi
            if [[ "$TAG_COMMIT" != "$EXPECTED_SHA" ]]; then
              echo "Release tag $RELEASE_TAG points at $TAG_COMMIT, not this workflow run's immutable commit $GITHUB_SHA." >&2
              echo "Create a fresh release tag on the completed migration commit; historical tags are never rebuilt." >&2
              exit 1
            fi
          else
            if [[ -n "$EXPECTED_SHA" ]]; then
              echo "expected_sha is only valid when a release tag is supplied." >&2
              exit 1
            fi
            echo "No release tag supplied; building workflow artifacts only."
          fi

          VERSION="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -n 1)"
          DESKTOP_VERSION="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' packages/apps/desktop/package.json | head -n 1)"
          VERSION_TAG="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ $SEMVER_RE ]]; then
            echo "Release version is not valid SemVer: $VERSION." >&2
            exit 1
          fi
          if [[ -z "$VERSION" || "$DESKTOP_VERSION" != "$VERSION" || "$VERSION_TAG" != "v$VERSION" ]]; then
            echo "Release version mismatch: root=$VERSION desktop=$DESKTOP_VERSION VERSION=$VERSION_TAG." >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $VERSION." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The two Linux build legs stay on 22.04 on purpose: they compile the
        # native addon that ships in the installer, so the runner's glibc is the
        # floor every user inherits. Raising it here would raise the minimum glibc
        # of the published binary. The validate and publish jobs compile nothing
        # and track the supported-runner floor in flint.toml instead.
        include:
          - label: macos-universal
            runner: macos-14
          - label: windows-x64
            runner: windows-latest
          - label: linux-x64
            runner: ubuntu-22.04
          - label: linux-arm64
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify bootstrap resources
        run: pnpm --filter @flinttrade/desktop verify:bootstrap-manifest

      - name: Bundle Electron main and preload
        run: pnpm --filter @flinttrade/desktop bundle

      - name: Exercise native POSIX no-replace promotion
        if: runner.os != 'Windows'
        run: pnpm --filter @flinttrade/desktop exec node scripts/run-required-atomic-promoter-test.mjs

      - name: Exercise native Windows source promotion and preserve-only cleanup
        if: matrix.label == 'windows-x64'
        run: pnpm --filter @flinttrade/desktop test:windows-source-fs

      - name: Prepare Apple signing or ad-hoc sealing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          present=0
          for value in "$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_SIGNING_IDENTITY"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            MAC_IDENTITY="-"
            echo "MAC_IDENTITY=$MAC_IDENTITY" >> "$GITHUB_ENV"
            echo "MAC_HARDENED_RUNTIME=false" >> "$GITHUB_ENV"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "FLINTTRADE_REQUIRE_DISTRIBUTION_SIGNATURE=0" >> "$GITHUB_ENV"
            echo "Apple signing secrets are absent; the application will be ad-hoc sealed."
            exit 0
          fi
          if [[ "$present" -ne 3 ]]; then
            echo "Apple signing secrets are incomplete; refusing to produce a partially configured release." >&2
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/flinttrade-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          MAC_IDENTITY="$APPLE_SIGNING_IDENTITY"
          for prefix in \
            "Developer ID Application: " \
            "Developer ID Installer: " \
            "3rd Party Mac Developer Application: " \
            "3rd Party Mac Developer Installer: "; do
            MAC_IDENTITY="${MAC_IDENTITY#"$prefix"}"
          done
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F -- "$MAC_IDENTITY"; then
            echo "APPLE_SIGNING_IDENTITY did not match an imported code-signing identity." >&2
            exit 1
          fi
          echo "MAC_IDENTITY=$MAC_IDENTITY" >> "$GITHUB_ENV"
          echo "MAC_HARDENED_RUNTIME=true" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "FLINTTRADE_REQUIRE_DISTRIBUTION_SIGNATURE=1" >> "$GITHUB_ENV"

      - name: Validate optional Apple notarisation secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          present=0
          for value in "$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -ne 0 && "$present" -ne 3 ]]; then
            echo "Apple notarisation secrets are incomplete; refusing to publish an unnotarised signed build by accident." >&2
            exit 1
          fi
          if [[ "$MAC_IDENTITY" != "-" && "$present" -ne 3 ]]; then
            echo "Distribution-signed macOS releases require the complete Apple notarisation secret trio." >&2
            exit 1
          fi
          if [[ "$present" -eq 3 && "$MAC_IDENTITY" == "-" ]]; then
            echo "Apple notarisation credentials cannot be used with an ad-hoc application seal." >&2
            exit 1
          fi

      - name: Rebuild and bind the macOS native promoter to the release identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          FLINTTRADE_NATIVE_MAC_IDENTITY="$MAC_IDENTITY" \
            FLINTTRADE_NATIVE_MAC_KEYCHAIN="${CSC_KEYCHAIN:-}" \
            pnpm --filter @flinttrade/desktop bundle
          pnpm --filter @flinttrade/desktop exec node scripts/run-required-atomic-promoter-test.mjs

      - name: Build universal macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          pnpm --filter @flinttrade/desktop exec electron-builder \
            --mac dmg --universal --publish never \
            --config.mac.identity="$MAC_IDENTITY" \
            --config.mac.hardenedRuntime="$MAC_HARDENED_RUNTIME"

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm --filter @flinttrade/desktop exec electron-builder --win nsis --x64 --publish never

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.label }}" == "linux-arm64" ]]; then
            pnpm --filter @flinttrade/desktop exec electron-builder --linux AppImage --arm64 --publish never
          else
            pnpm --filter @flinttrade/desktop exec electron-builder --linux AppImage --x64 --publish never
          fi

      - name: Verify packaged Electron directory
        run: pnpm --filter @flinttrade/desktop verify:package

      - name: Verify macOS code seal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find packages/apps/desktop/release/electron -type d -name FlintTrade.app -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "Packaged FlintTrade.app was not found." >&2
            exit 1
          fi
          codesign --verify --deep --strict "$APP_PATH"

      - name: Stage canonical installer
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          case "${{ matrix.label }}" in
            macos-universal) EXPECTED="FlintTrade-${VERSION}-mac-universal.dmg" ;;
            windows-x64) EXPECTED="FlintTrade-${VERSION}-win-x64.exe" ;;
            linux-x64) EXPECTED="FlintTrade-${VERSION}-linux-x64.AppImage" ;;
            linux-arm64) EXPECTED="FlintTrade-${VERSION}-linux-arm64.AppImage" ;;
            *) echo "Unknown release matrix label." >&2; exit 1 ;;
          esac
          SOURCE="packages/apps/desktop/release/electron/$EXPECTED"
          if [[ ! -f "$SOURCE" ]]; then
            echo "No installers were produced for ${{ matrix.label }} at the canonical path $SOURCE." >&2
            find packages/apps/desktop/release/electron -maxdepth 2 -type f -print | sort >&2 || true
            exit 1
          fi
          mkdir -p dist-installers
          cp "$SOURCE" "dist-installers/$EXPECTED"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flinttrade-desktop-${{ matrix.label }}
          path: dist-installers/*
          if-no-files-found: error

  publish:
    name: Publish installers and provenance
    needs: [validate, build]
    if: github.event.inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Verify immutable tag and empty target release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          GUARD_REF="refs/flinttrade-release-publish/tag"
          if ! git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:$GUARD_REF"; then
            echo "Remote release tag $RELEASE_TAG moved or disappeared after validation." >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse --verify "$GUARD_REF^{commit}" 2>/dev/null || true)"
          if [[ "$TAG_COMMIT" != "$SOURCE_SHA" ]]; then
            echo "Remote release tag $RELEASE_TAG moved or disappeared after validation: expected $SOURCE_SHA, got ${TAG_COMMIT:-missing}." >&2
            exit 1
          fi
          ASSET_COUNT="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets | length'
          )"
          if [[ "$ASSET_COUNT" != "0" ]]; then
            echo "Release $RELEASE_TAG already has $ASSET_COUNT asset(s); refusing to overwrite or retire any existing release asset." >&2
            exit 1
          fi

      - name: Download installer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts

      - name: Flatten and verify the four canonical installers
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist-installers
          EXPECTED=(
            "FlintTrade-${VERSION}-mac-universal.dmg"
            "FlintTrade-${VERSION}-win-x64.exe"
            "FlintTrade-${VERSION}-linux-x64.AppImage"
            "FlintTrade-${VERSION}-linux-arm64.AppImage"
          )
          for name in "${EXPECTED[@]}"; do
            mapfile -t matches < <(find release-artifacts -type f -name "$name" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one $name, found ${#matches[@]}." >&2
              exit 1
            fi
            cp "${matches[0]}" "dist-installers/$name"
          done
          if [[ "$(find dist-installers -maxdepth 1 -type f | wc -l | tr -d ' ')" -ne 4 ]]; then
            echo "No installers were produced as the exact four-artifact release set." >&2
            exit 1
          fi
          (
            cd dist-installers
            sha256sum "${EXPECTED[@]}" > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-installers/*.dmg
            dist-installers/*.exe
            dist-installers/*.AppImage
            dist-installers/SHA256SUMS.txt

      - name: Re-verify immutable tag and empty target release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          GUARD_REF="refs/flinttrade-release-publish/tag"
          if ! git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:$GUARD_REF"; then
            echo "Remote release tag $RELEASE_TAG moved or disappeared before publication." >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse --verify "$GUARD_REF^{commit}" 2>/dev/null || true)"
          if [[ "$TAG_COMMIT" != "$SOURCE_SHA" ]]; then
            echo "Remote release tag $RELEASE_TAG moved or disappeared before publication: expected $SOURCE_SHA, got ${TAG_COMMIT:-missing}." >&2
            exit 1
          fi
          ASSET_COUNT="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets | length'
          )"
          if [[ "$ASSET_COUNT" != "0" ]]; then
            echo "Release $RELEASE_TAG gained $ASSET_COUNT asset(s) during this run; refusing to overwrite or retire them." >&2
            exit 1
          fi

      - name: Publish to release
        id: publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ needs.validate.outputs.source_sha }}
          files: dist-installers/*
          draft: false
          prerelease: ${{ contains(inputs.tag, '-') }}
          overwrite_files: false
          fail_on_unmatched_files: true

      - name: Re-verify immutable tag and exact published asset set
        if: ${{ always() && (steps.publish.outcome == 'success' || steps.publish.outcome == 'failure') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          GUARD_REF="refs/flinttrade-release-publish/tag"
          if ! git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:$GUARD_REF"; then
            echo "Remote release tag $RELEASE_TAG moved or disappeared after publication." >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse --verify "$GUARD_REF^{commit}" 2>/dev/null || true)"
          if [[ "$TAG_COMMIT" != "$SOURCE_SHA" ]]; then
            echo "Remote release tag $RELEASE_TAG moved or disappeared after publication: expected $SOURCE_SHA, got ${TAG_COMMIT:-missing}." >&2
            exit 1
          fi
          EXPECTED=(
            "FlintTrade-${VERSION}-mac-universal.dmg"
            "FlintTrade-${VERSION}-win-x64.exe"
            "FlintTrade-${VERSION}-linux-x64.AppImage"
            "FlintTrade-${VERSION}-linux-arm64.AppImage"
            "SHA256SUMS.txt"
          )
          expected_set="$(printf '%s\n' "${EXPECTED[@]}" | LC_ALL=C sort)"
          actual_set="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq '.assets[].name' | LC_ALL=C sort
          )"
          if [[ "$actual_set" != "$expected_set" ]]; then
            echo "Published release asset set is not canonical." >&2
            diff -u <(printf '%s\n' "$expected_set") <(printf '%s\n' "$actual_set") >&2 || true
            exit 1
          fi
