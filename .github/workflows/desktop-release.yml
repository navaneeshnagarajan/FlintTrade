name: Desktop Release

# Builds the native FlintTrade desktop installers for every supported OS /
# architecture and (on a version tag) attaches them to a GitHub Release.
#
#   • macOS    — .dmg                  (arm64 + Intel x64)
#   • Windows  — .exe (NSIS)           (x64)
#   • Linux    — .deb + .rpm + .AppImage (x64 + arm64)
#
# Each job freezes the Python backend into a sidecar (PyInstaller), then bundles
# it inside a Tauri 2 shell. See docs/DESKTOP.md and packaging/.
#
# Trigger: dispatched by release-please.yml with the new tag after a release
# PR merges, or run manually (workflow_dispatch). Version-tag pushes are
# intentionally not used here because tags created by release-please's
# GITHUB_TOKEN cannot trigger tag-push workflows, and repo CI policy keeps
# expensive runners behind explicit or scheduled execution only.
#
# Signing is secrets-gated and dormant until the secrets exist:
#   • APPLE_CERTIFICATE (base64 .p12) + APPLE_CERTIFICATE_PASSWORD +
#     APPLE_SIGNING_IDENTITY, and APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID
#     for notarisation — macOS ships unsigned without them (Gatekeeper:
#     right-click → Open on first launch; documented in docs/DESKTOP.md).
#   • TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) — the free minisign updater key,
#     unrelated to Apple signing. When present, updater artifacts (.sig,
#     .app.tar.gz) and latest.json are produced so tauri-plugin-updater can
#     one-click update on every platform.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish under (e.g. v0.6.0-beta.1). Leave blank to only upload build artifacts.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - label: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify release tag matches package version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_TAG=""
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG:-}" ]]; then
            RELEASE_TAG="$INPUT_TAG"
          fi

          if [[ -z "$RELEASE_TAG" ]]; then
            echo "No release tag supplied; building workflow artifacts only."
            exit 0
          fi

          TAG_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}" 2>/dev/null || true)"
          if [[ -n "$TAG_COMMIT" && "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            # Re-dispatch escape hatch: rebuilding the CURRENT release after a
            # workflow-only fix is legitimate — the installers are built from
            # the tag checkout, not from GITHUB_SHA. Allow it only when the tag
            # is an ancestor of the dispatch commit (main moved forward, never
            # a divergent or rewritten tag) AND it is still the newest version
            # tag (rebuilding an older release must never regress the rolling
            # updater-channel manifest).
            NEWEST_TAG="$(git tag -l 'v*' | sort -V | tail -n 1)"
            if git merge-base --is-ancestor "$TAG_COMMIT" "$GITHUB_SHA" \
               && [[ "$RELEASE_TAG" == "$NEWEST_TAG" ]]; then
              echo "Rebuilding current release $RELEASE_TAG from its tag checkout ($TAG_COMMIT); dispatch commit $GITHUB_SHA carries only post-tag changes."
            else
              echo "Release tag $RELEASE_TAG points at $TAG_COMMIT, not this workflow run's commit $GITHUB_SHA." >&2
              echo "Create a fresh tag on the current main head before publishing installers." >&2
              exit 1
            fi
          fi

          VERSION="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -n 1)"
          DESKTOP_VERSION="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' packages/apps/desktop/package.json | head -n 1)"
          TAURI_VERSION="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' packages/apps/desktop/src-tauri/tauri.conf.json | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read package.json version." >&2
            exit 1
          fi
          if [[ "$DESKTOP_VERSION" != "$VERSION" || "$TAURI_VERSION" != "$VERSION" ]]; then
            echo "Release version mismatch: root=$VERSION desktop=$DESKTOP_VERSION tauri=$TAURI_VERSION." >&2
            exit 1
          fi
          case "$RELEASE_TAG" in
            "v$VERSION"|"v$VERSION"-*) ;;
            *)
              echo "Release tag $RELEASE_TAG does not match package.json version $VERSION." >&2
              echo "Use v$VERSION or v$VERSION-<suffix>, or bump package versions first." >&2
              exit 1
              ;;
          esac

      # --- Toolchains ----------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/apps/desktop/src-tauri -> target

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      # --- Linux system dependencies for Tauri 2 -------------------------
      - name: Install Linux build dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          # xdg-utils: the AppImage bundler needs /usr/bin/xdg-open; the x64
          # runner image ships it but ubuntu-22.04-arm does not.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libgtk-3-dev \
            build-essential \
            file \
            xdg-utils

      # --- Python backend deps + PyInstaller -----------------------------
      - name: Install Python dependencies
        run: |
          # Desktop packaging excludes the optional numba/llvmlite ML stack;
          # macOS Intel has no compatible llvmlite wheel and must not build it.
          uv sync --frozen --extra desktop

      # --- Frontend deps + build -----------------------------------------
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build terminal frontend
        # Force base "/" so the bundle is never contaminated by a site-demo
        # build (base "/demo-app/"); the backend serves the SPA from the root.
        run: pnpm --filter @flinttrade/terminal build -- --base=/

      # --- Freeze the backend into a Tauri sidecar -----------------------
      - name: Build backend sidecar
        shell: bash
        env:
          SKIP_FRONTEND: '1'
          TARGET_TRIPLE: ${{ matrix.target }}
        run: bash packaging/build-backend.sh

      # --- Signing/notarisation (dormant until secrets exist) -------------
      - name: Import Apple signing certificate
        if: contains(matrix.target, 'apple')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "No Apple certificate secret; building an unsigned macOS bundle."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/flinttrade-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "Apple signing certificate imported."

      # --- Bundle the Tauri desktop app ----------------------------------
      - name: Build desktop installers
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Tauri reads the APPLE_*/TAURI_SIGNING_* env vars directly; an empty
          # value must be absent, not empty, or it attempts signing with it.
          for var in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                     TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!var:-}" ]]; then unset "$var"; fi
          done
          BUNDLE_ARGS=()
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            # WiX/MSI rejects beta SemVer like 0.6.0-beta.1; NSIS produces the
            # Windows .exe installer without flattening the public version.
            BUNDLE_ARGS+=(--bundles nsis)
          fi
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            # Updater artifacts need the minisign key to produce .sig files.
            BUNDLE_ARGS+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          pnpm --filter @flinttrade/desktop tauri build --target ${{ matrix.target }} "${BUNDLE_ARGS[@]}"

      # --- Collect installers --------------------------------------------
      - name: Stage installers
        id: stage
        shell: bash
        run: |
          OUT="dist-installers"
          mkdir -p "$OUT"
          BUNDLE="packages/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          # Copy every produced installer plus updater artifacts (.sig
          # signatures and the macOS .app.tar.gz updater bundle), ignoring
          # missing per-OS types.
          find "$BUNDLE" -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.sig' -o -name '*.app.tar.gz' \) \
            -exec cp {} "$OUT/" \; 2>/dev/null || true
          COUNT="$(find "$OUT" -type f | wc -l | tr -d ' ')"
          if [ "$COUNT" -eq 0 ]; then
            echo "No installers were produced for ${{ matrix.label }} at $BUNDLE" >&2
            find "packages/apps/desktop/src-tauri/target" -maxdepth 5 -type f | sort >&2 || true
            exit 1
          fi
          echo "installer_count=$COUNT" >> "$GITHUB_OUTPUT"
          # Arch-qualify the macOS updater bundle: Tauri names it
          # FlintTrade.app.tar.gz with no architecture, so the two macOS jobs
          # would collide in the flattened release assets and the updater
          # manifest could not attribute either arch (its platform mapping
          # requires an arch token in the filename).
          if [[ "${{ matrix.target }}" == *apple* ]]; then
            for f in "$OUT"/*.app.tar.gz; do
              [ -f "$f" ] || continue
              base="$(basename "$f" .app.tar.gz)"
              mv "$f" "$OUT/${base}_${{ matrix.target }}.app.tar.gz"
              if [ -f "$f.sig" ]; then
                mv "$f.sig" "$OUT/${base}_${{ matrix.target }}.app.tar.gz.sig"
              fi
            done
          fi
          # Stage the frozen backend itself as the fast-moving payload asset:
          # the shell can fetch and hash-verify it for daily backend+frontend
          # updates without an installer cycle (Ollama-runtime pattern).
          EXE_SUFFIX=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then EXE_SUFFIX=".exe"; fi
          SIDECAR="packages/apps/desktop/src-tauri/binaries/flinttrade-backend-${{ matrix.target }}${EXE_SUFFIX}"
          if [[ ! -f "$SIDECAR" ]]; then
            echo "Frozen backend sidecar missing at $SIDECAR" >&2
            exit 1
          fi
          cp "$SIDECAR" "$OUT/flinttrade-payload-${{ matrix.target }}${EXE_SUFFIX}"
          echo "Installers staged:"; ls -lah "$OUT" || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: flinttrade-desktop-${{ matrix.label }}
          path: dist-installers/*
          if-no-files-found: error

  publish:
    name: Publish release manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Flatten installer artifacts
        shell: bash
        run: |
          mkdir -p dist-installers
          find release-artifacts -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.sig' -o -name '*.app.tar.gz' \
               -o -name 'flinttrade-payload-*' \) \
            -exec cp {} dist-installers/ \;
          COUNT="$(find dist-installers -type f | wc -l | tr -d ' ')"
          if [ "$COUNT" -eq 0 ]; then
            echo "No installer artifacts were downloaded." >&2
            find release-artifacts -maxdepth 3 -type f -print >&2 || true
            exit 1
          fi
          echo "Publishing installers:"; ls -lah dist-installers

      - name: Generate desktop manifest and checksums
        shell: bash
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          root = Path("dist-installers")
          tag = os.environ["TAG_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          version = tag[1:] if tag.startswith("v") else tag
          prerelease = "-" in version
          channel = "beta" if prerelease else "stable"

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def asset_kind(name: str) -> tuple[str, str, str] | None:
              lower = name.lower()
              arch = None
              if any(token in lower for token in ("aarch64", "arm64")):
                  arch = "arm64"
              elif any(token in lower for token in ("x86_64", "amd64", "x64")):
                  arch = "x64"
              if arch is None:
                  return None

              if lower.endswith(".dmg"):
                  return ("macos", arch, "dmg")
              if lower.endswith(".exe") and "setup" in lower:
                  return ("windows", arch, "nsis")
              if lower.endswith(".appimage"):
                  return ("linux", arch, "appimage")
              if lower.endswith(".deb"):
                  return ("linux", arch, "deb")
              if lower.endswith(".rpm"):
                  return ("linux", arch, "rpm")
              return None

          assets = []
          sums = []
          for path in sorted(root.iterdir(), key=lambda item: item.name.lower()):
              if not path.is_file():
                  continue
              digest = sha256(path)
              sums.append(f"{digest}  {path.name}\n")
              parsed = asset_kind(path.name)
              if parsed is None:
                  continue
              os_name, arch, kind = parsed
              assets.append(
                  {
                      "os": os_name,
                      "arch": arch,
                      "kind": kind,
                      "name": path.name,
                      "size": path.stat().st_size,
                      "url": f"https://github.com/{repo}/releases/download/{quote(tag)}/{quote(path.name)}",
                      "sha256": digest,
                  }
              )

          if not assets:
              raise SystemExit("No desktop installer assets could be parsed for the release manifest.")

          expected = {
              ("macos", "arm64", "dmg"),
              ("macos", "x64", "dmg"),
              ("windows", "x64", "nsis"),
              ("linux", "x64", "appimage"),
              ("linux", "arm64", "appimage"),
              ("linux", "x64", "deb"),
              ("linux", "arm64", "deb"),
              ("linux", "x64", "rpm"),
              ("linux", "arm64", "rpm"),
          }
          seen: dict[tuple[str, str, str], str] = {}
          duplicates = []
          for asset in assets:
              key = (asset["os"], asset["arch"], asset["kind"])
              if key in seen:
                  duplicates.append((key, seen[key], asset["name"]))
              seen[key] = asset["name"]
          if duplicates:
              detail = ", ".join(f"{key}: {first} and {second}" for key, first, second in duplicates)
              raise SystemExit(f"Duplicate desktop installer assets detected: {detail}")
          missing = sorted(expected - set(seen))
          if missing:
              detail = ", ".join("/".join(item) for item in missing)
              raise SystemExit(f"Missing required desktop installer assets: {detail}")

          # Fast-moving payload assets: the frozen backend (which embeds the
          # built terminal) per target triple, hash-verified by the shell.
          payload_triples = {
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
              "x86_64-pc-windows-msvc",
              "x86_64-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu",
          }
          payloads = {}
          for path in sorted(root.iterdir()):
              if not path.name.startswith("flinttrade-payload-"):
                  continue
              triple = path.name.removeprefix("flinttrade-payload-").removesuffix(".exe")
              payloads[triple] = {
                  "name": path.name,
                  "size": path.stat().st_size,
                  "url": f"https://github.com/{repo}/releases/download/{quote(tag)}/{quote(path.name)}",
                  "sha256": sha256(path),
              }
          missing_payloads = sorted(payload_triples - set(payloads))
          if missing_payloads:
              raise SystemExit(f"Missing backend payload assets: {', '.join(missing_payloads)}")

          (root / "SHA256SUMS.txt").write_text("".join(sums), encoding="utf-8")
          manifest = {
              "tag": tag,
              "version": version,
              "channel": channel,
              "prerelease": prerelease,
              "published_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "html_url": f"https://github.com/{repo}/releases/tag/{quote(tag)}",
              "assets": assets,
              "payloads": payloads,
          }
          (root / "flinttrade-desktop-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          # Tauri updater manifest (latest.json) — only when the build was
          # updater-signed (a .sig exists per updatable platform artifact).
          sig_files = {path.name: path.read_text(encoding="utf-8").strip() for path in root.glob("*.sig")}
          if sig_files:
              platform_kinds = {
                  "darwin-aarch64": (".app.tar.gz", ("aarch64", "arm64"), None),
                  "darwin-x86_64": (".app.tar.gz", ("x86_64", "x64"), None),
                  "windows-x86_64": (".exe", ("x86_64", "x64", "setup"), "setup"),
                  "linux-x86_64": (".appimage", ("x86_64", "amd64"), None),
                  "linux-aarch64": (".appimage", ("aarch64", "arm64"), None),
              }
              platforms = {}
              for platform_key, (suffix, arch_tokens, required_token) in platform_kinds.items():
                  for path in sorted(root.iterdir()):
                      lower = path.name.lower()
                      if not lower.endswith(suffix.lower()):
                          continue
                      if required_token and required_token not in lower:
                          continue
                      if not any(token in lower for token in arch_tokens):
                          continue
                      signature = sig_files.get(path.name + ".sig")
                      if signature is None:
                          continue
                      platforms[platform_key] = {
                          "signature": signature,
                          "url": f"https://github.com/{repo}/releases/download/{quote(tag)}/{quote(path.name)}",
                      }
                      break
              missing_platforms = sorted(set(platform_kinds) - set(platforms))
              if missing_platforms:
                  raise SystemExit(
                      "Updater signing is enabled but latest.json is missing platforms: "
                      + ", ".join(missing_platforms)
                  )
              latest = {
                  "version": version,
                  "notes": f"FlintTrade {tag} — see {manifest['html_url']}",
                  "pub_date": manifest["published_at"],
                  "platforms": platforms,
              }
              (root / "latest.json").write_text(
                  json.dumps(latest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
          else:
              print("No updater signatures present; skipping latest.json (TAURI_SIGNING_PRIVATE_KEY unset).")
          PY

          cat dist-installers/flinttrade-desktop-manifest.json

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist-installers/*
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Update the rolling channel manifest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Stable per-channel URLs that survive domain moves: the installer
          # scripts and the in-app updater fetch
          #   releases/download/updater-<channel>/flinttrade-desktop-manifest.json
          #   releases/download/updater-<channel>/latest.json
          # instead of any first-party web host. /releases/latest/download only
          # resolves non-prerelease tags, so betas need this rolling release.
          case "$TAG_NAME" in
            *-*) CHANNEL="beta" ;;
            *)   CHANNEL="stable" ;;
          esac
          ROLLING="updater-${CHANNEL}"
          ASSETS=(dist-installers/flinttrade-desktop-manifest.json dist-installers/SHA256SUMS.txt)
          if [[ -f dist-installers/latest.json ]]; then
            ASSETS+=(dist-installers/latest.json)
          fi
          if ! gh release view "$ROLLING" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$ROLLING" --repo "$GITHUB_REPOSITORY" \
              --title "FlintTrade ${CHANNEL} channel manifest" \
              --notes "Rolling pointer to the newest ${CHANNEL} release. Do not download installers from here; they live on the versioned releases." \
              --prerelease --latest=false
          fi
          gh release upload "$ROLLING" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Rolling ${ROLLING} manifest now points at ${TAG_NAME}."
