name: Upstream Drift Check

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Allow manual trigger

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check upstream versions
        run: python scripts/check_upstream.py > upstream-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: upstream-drift-report
          path: upstream-report.md

      - name: Check for critical drift
        run: |
          # Fail if any submodule is more than 50 commits behind
          BEHIND=$(python -c "
          import json, subprocess, sys
          result = subprocess.run(
              [sys.executable, 'scripts/check_upstream.py', '--format', 'json', '--skip-pip', '--skip-npm'],
              capture_output=True, text=True
          )
          data = json.loads(result.stdout)
          max_behind = max((r['commits_behind'] for r in data if r['category'] == 'submodule'), default=0)
          print(max_behind)
          ")
          echo "Max submodule drift: $BEHIND commits"
          if [ "$BEHIND" -gt 50 ]; then
            echo "::warning::Submodule drift detected: $BEHIND commits behind upstream"
          fi
