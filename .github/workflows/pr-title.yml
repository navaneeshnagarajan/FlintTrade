# PR titles become squash-merge commit subjects on main, and release-please
# parses those subjects to build changelogs and version bumps — so a
# malformed title corrupts release notes. Fail fast at the PR stage instead.
#
# Scope is optional (repo history mixes scoped and unscoped titles); the
# "revert" type is allowed for revert PRs.
name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  check-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|chore|refactor|perf|ci|revert)(\([a-z0-9./-]+\))?!?: .+'
          if printf '%s' "$PR_TITLE" | grep -qE "$pattern"; then
            echo "PR title follows Conventional Commits: $PR_TITLE"
          else
            echo "::error::PR title does not follow Conventional Commits: '$PR_TITLE'"
            echo "This repository squash-merges, so the PR title becomes the commit"
            echo "subject on main, and release-please builds release notes and"
            echo "version bumps from those subjects."
            echo ""
            echo "Expected format:  type(scope)?: summary"
            echo "Allowed types:    feat fix docs test chore refactor perf ci revert"
            echo "Examples:         feat(terminal): add OI profile widget"
            echo "                  docs: correct preset layout count"
            echo "                  revert: feat(engine): scheduler rework"
            exit 1
          fi
