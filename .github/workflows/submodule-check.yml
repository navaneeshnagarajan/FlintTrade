name: Submodule Compatibility Check

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM UTC (11:30 AM IST)
  workflow_dispatch:  # Manual trigger

jobs:
  check-submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update submodules to latest
        run: |
          git submodule update --remote infra/openalgo
          git submodule update --remote infra/algomirror
          git submodule update --remote infra/openclaw

      - name: Run gateway adapter tests
        run: python -m pytest packages/gateway/tests/ -v --tb=short --import-mode=importlib

      - name: Run full test suite
        run: python -m pytest packages/*/tests/ tests/ -v --tb=short --import-mode=importlib

      - name: Report result
        if: failure()
        run: echo "::error::Submodule update broke tests. Adapter layer may need updating."
