name: Test
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python -m pytest packages/*/tests/ tests/ -v --tb=short --import-mode=importlib
      - run: ruff check packages/*/src/ --output-format=github
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install dependencies
        run: cd packages/terminal && npm ci --legacy-peer-deps
      - name: TypeScript strict check
        run: cd packages/terminal && npx tsc --noEmit
      - name: Run Vitest tests
        run: cd packages/terminal && npx vitest run
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
      - name: Build check
        run: cd packages/terminal && npm run build
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          FOUND=0
          for p in 'BROKER_API_KEY\s*=\s*['"'"'"][^'"'"'"]+['"'"'"]' 'sk-[a-zA-Z0-9]{20,}'; do
            grep -rn "$p" --include="*.py" --include="*.js" --include="*.toml" . 2>/dev/null | grep -v ".env.example" && FOUND=1
          done
          [ "$FOUND" -eq 1 ] && exit 1 || echo "✅ No secrets"
