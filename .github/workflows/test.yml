name: Test
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/site/**'
      - '.local/**'
      - 'NOTICE'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/workflows/claude*.yml'
      - '.github/workflows/status-report.yml'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/site/**'
      - '.local/**'
      - 'NOTICE'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/workflows/claude*.yml'
      - '.github/workflows/status-report.yml'
      - '.github/ISSUE_TEMPLATE/**'

# Cancel earlier in-flight runs when a new commit lands on the same ref.
# Stops the back-to-back-push amplification that was burning minutes —
# multiple pushes within a few minutes used to all run to completion;
# now only the latest does.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Skip the whole matrix on draft PRs — cuts noise while a PR is in
# active development. A PR-author opens the PR as draft, pushes
# iteratively without CI cost, then marks ready-for-review when they
# want CI to run.
jobs:
  # ----------------------------------------------------------------------
  # Python tests
  #
  # Parallel execution with pytest-xdist (-n auto) works locally and is
  # the long-term goal, but several pre-existing tests share module-level
  # state (singleton DBs in app.py beyond the ones already migrated to
  # workspace_dir(), various global mocks, etc.). A dedicated
  # test-isolation sprint is needed before we can flip xdist on for CI.
  # Keeping CI serial for now; --timeout=60 catches hangs; pytest-randomly
  # (auto-loaded from requirements.txt) randomises order to surface
  # order-dependent flakes early so they get fixed before we go parallel.
  # ----------------------------------------------------------------------
  python-tests:
    # Skip the matrix on draft PRs — open as draft, push iteratively without
    # CI cost, then mark ready-for-review when you want CI to run.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Verify pre-restructure baseline artefacts
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path("flinttrade-design/baselines/MANIFEST.json").read_text())
          missing = []
          for artefact in manifest["artefacts"]:
              if not any(pathlib.Path(path).exists() for path in artefact["paths"]):
                  missing.append(artefact["id"])
          if missing:
              print("missing baseline artefacts:", ", ".join(missing))
              sys.exit(1)
          print("baseline artefacts OK:", ", ".join(a["id"] for a in manifest["artefacts"]))
          PY
      - name: Workspace migration round-trip test
        run: |
          python -m pytest packages/core/tests/test_workspace_migrations.py -v --import-mode=importlib
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from packages.core.src.workspace_migrations import run_migrations

          with tempfile.TemporaryDirectory() as d:
              Path(d, "workspace.json").write_text(json.dumps({"version": "0.5.2", "modules": {"ai": True}}))
              result = run_migrations(Path(d))
              on_disk = json.loads(Path(d, "workspace.json").read_text())
              assert result == on_disk, "atomic persist did not happen"
              assert result["version"] == "1.0.0"
              assert result["brokers"]["execution"]["default"] == "openalgo:default"
          PY
      # --timeout-method=thread uses a watchdog thread + _thread.interrupt_main()
      # instead of SIGALRM. SIGALRM can't reliably interrupt CPython's
      # thread.join() on Linux (the C wait loop doesn't propagate EINTR), which
      # is how a single bad thread cleanup deadlocks the whole job until the
      # 6-hour runner timeout. Watchdog method works regardless. See the
      # PositionWatcher fix in packages/ditto/src/mirror.py for the original
      # hang vector.
      - run: python -m pytest packages/ai/tests/ packages/automation/tests/ packages/backtest-engine/tests/ packages/core/tests/ packages/data/tests/ packages/ditto/tests/ packages/engine/tests/ packages/gateway/tests/ packages/historical/tests/ packages/indicators/tests/ packages/integration/tests/ packages/screener/tests/ packages/tick-engine/tests/ tests/ -v --tb=short --import-mode=importlib --timeout=60 --timeout-method=thread
      - run: ruff check packages/*/src/ --output-format=github

  # NOTE: macOS and Windows cross-platform checks used to run on every push +
  # PR with `continue-on-error: true` (cosmetic — never gated anything). On
  # GitHub-hosted runners macOS costs 10× and Windows 2× the Linux minute
  # rate, so a single push burned ≈13× the minutes of a Linux-only run for
  # signal that nobody actioned on. Moved to a dedicated weekly nightly
  # workflow (`.github/workflows/nightly-cross-platform.yml`) on a cron
  # schedule + manual `workflow_dispatch`. If a cross-platform regression
  # surfaces in the weekly run, fix-it-then commit; per-push doesn't need
  # the matrix.

  node-core-tests:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: cd packages/terminal && npm ci --legacy-peer-deps
      - name: TypeScript strict check
        run: cd packages/terminal && npx tsc --noEmit
      - name: Run core tests
        run: cd packages/terminal && npx vitest run --pool=forks --poolOptions.forks.singleFork src/lib/ src/stores/ src/atoms/ src/services/ src/test-utils/ src/hooks/__tests__/useGlobalKeys.test.ts src/hooks/__tests__/useFeatureGate.test.ts src/hooks/__tests__/useSkillContent.test.ts src/hooks/__tests__/useTradingStoreSync.test.ts
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      - name: Build check
        run: cd packages/terminal && npm run build

  node-widget-tests-1:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: cd packages/terminal && npm ci --legacy-peer-deps
      - name: Run trading + utility A-H widget tests
        run: cd packages/terminal && npx vitest run --pool=forks --poolOptions.forks.singleFork src/widgets/trading/ src/widgets/utility/AIAdvisor/ src/widgets/utility/Alerts/ src/widgets/utility/AuditTrail/ src/widgets/utility/Calculator/ src/widgets/utility/CurrencyConverter/ src/widgets/utility/EarningsCalendar/ src/widgets/utility/EconomicCalendar/ src/widgets/utility/ExpiryCountdown/ src/widgets/utility/FundingRate/ src/widgets/utility/GlobalIndices/ src/widgets/utility/Health/
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  node-widget-tests-2a:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: cd packages/terminal && npm ci --legacy-peer-deps
      - name: Run utility widget tests (M-S)
        run: cd packages/terminal && npx vitest run --pool=forks --poolOptions.forks.singleFork src/widgets/utility/MarketClock/ src/widgets/utility/MarketSummary/ src/widgets/utility/News/ src/widgets/utility/PositionSizing/ src/widgets/utility/ProfitTarget/ src/widgets/utility/Scanner/
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  node-widget-tests-2b:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: cd packages/terminal && npm ci --legacy-peer-deps
      - name: Run utility widget tests (S-W, one at a time)
        run: |
          cd packages/terminal
          FAIL=0
          # TradeIdea excluded: OOMs at 4GB+ heap (vitest module resolution overhead).
          # Passes locally with --max-old-space-size=8192. CI runner limited to 7GB total.
          for d in StrategyTemplates TickSpeed Ticker Watchlist; do
            echo "::group::Testing $d"
            npx vitest run --pool=forks --poolOptions.forks.singleFork "src/widgets/utility/$d/" || FAIL=1
            echo "::endgroup::"
          done
          exit $FAIL
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

  node-widget-tests-3:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: cd packages/terminal && npm ci --legacy-peer-deps
      - name: Run analysis + routes + tools + components tests
        run: cd packages/terminal && npx vitest run --pool=forks --poolOptions.forks.singleFork src/widgets/analysis/ src/routes/ src/tools/ src/components/
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  secrets-check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          FOUND=0
          for p in 'BROKER_API_KEY\s*=\s*['"'"'"][^'"'"'"]+['"'"'"]' 'sk-[a-zA-Z0-9]{20,}'; do
            grep -rn "$p" --include="*.py" --include="*.js" --include="*.toml" . 2>/dev/null | grep -v ".env.example" && FOUND=1
          done
          [ "$FOUND" -eq 1 ] && exit 1 || echo "✅ No secrets"
