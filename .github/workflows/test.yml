name: Test
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main, dev]
    paths-ignore:
      # (documentation, the site and flinttrade-design/ are not ignored — see
      # the pull_request note above.)
      - '.local/**'
      - 'notice'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/workflows/claude*.yml'
      - '.github/workflows/status-report.yml'
      - '.github/ISSUE_TEMPLATE/**'

# Cancel earlier in-flight runs when a new commit lands on the same ref.
# Back-to-back pushes only need the newest matrix; earlier runs are superseded.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # §14.3 CI env allowlist — activates tests/test_no_broker_creds_in_ci.py (gate #19) and
  # explicitly empties every broker credential var so a leaked higher-scope secret cannot
  # inherit into the test run. Default-mock (Identity H9) is enforced in tests/mocks/.
  FLINTTRADE_CI: "1"
  OPENALGO_API_KEY: ""
  DHAN_ACCESS_TOKEN: ""
  DHAN_API_KEY: ""
  DHAN_API_SECRET: ""
  DHAN_CLIENT_ID: ""
  DHAN_TOKEN: ""
  UPSTOX_API_KEY: ""
  UPSTOX_API_SECRET: ""
  UPSTOX_ACCESS_TOKEN: ""
  UPSTOX_REFRESH_TOKEN: ""
  UPSTOX_TOKEN: ""
  KOTAK_NEO_CONSUMER_KEY: ""
  KOTAK_NEO_CONSUMER_SECRET: ""
  KOTAK_NEO_MPIN: ""
  KOTAK_NEO_TOTP: ""
  KOTAK_NEO_TOTP_SECRET: ""
  KOTAK_NEO_ACCESS_TOKEN: ""
  KOTAK_NEO_SESSION_TOKEN: ""
  KOTAK_NEO_TOKEN: ""
  INDMONEY_API_KEY: ""
  INDMONEY_API_SECRET: ""
  INDMONEY_ACCESS_TOKEN: ""
  INDMONEY_TOKEN: ""
  KITE_API_KEY: ""
  KITE_API_SECRET: ""
  KITE_ACCESS_TOKEN: ""
  ZERODHA_API_KEY: ""
  ZERODHA_ACCESS_TOKEN: ""

# Least-privilege token. The default GITHUB_TOKEN scope is read-only:
# none of these jobs comment, push, or alter repo state — they only check
# out and run tests/lint/secret-scan. Narrowing the token is a GitHub
# hardening best practice and keeps the workflow's blast radius minimal.
permissions:
  contents: read

# Skip the whole matrix on draft PRs — cuts noise while a PR is in
# active development. A PR-author opens the PR as draft, pushes
# iteratively without CI cost, then marks ready-for-review when they
# want CI to run.
jobs:
  # ----------------------------------------------------------------------
  # Change classifier
  #
  # Documentation and marketing-site edits still have to run the jobs that
  # guard them (python-tests carries tests/test_windows_command_docs.py), but
  # they cannot break the widget shards, the Rust crate or the Electron
  # package. This job answers one question — "did anything outside
  # documentation and the site change?" — and the expensive lanes gate on it.
  #
  # Deliberately fails OPEN: an unresolvable diff range (first push to a new
  # branch, force push, shallow history) reports code=true so the full matrix
  # runs. Plain git, so no extra third-party action enters the supply chain.
  # ----------------------------------------------------------------------
  changed-surfaces:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          resolvable=1
          for sha in "${BASE_SHA:-}" "${HEAD_SHA:-}"; do
            if [ -z "$sha" ] || ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              resolvable=0
            fi
          done
          if [ "$resolvable" -ne 1 ]; then
            echo "Diff range not resolvable — running the full matrix."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          echo "Changed files:"
          echo "$changed"
          # Anything that is not Markdown/docs/site or one of the former ignored
          # surfaces (LICENSE, .local/**, notice, .git*, .editorconfig, claude*
          # workflows, status-report, ISSUE_TEMPLATE) is code. Former ignored
          # surfaces alone now classify non-code so they do not run the
          # widget/Rust/Electron lanes. Mixed with ordinary code -> code=true.
          # Unresolvable ranges already fail open above.
          if printf '%s\n' "$changed" | grep -qvE '(\.md$|^docs/|^packages/apps/site/|^\.local/|^notice$|^LICENSE$|^\.gitignore$|^\.gitattributes$|^\.editorconfig$|^\.github/workflows/claude.*\.yml$|^\.github/workflows/status-report\.yml$|^\.github/ISSUE_TEMPLATE/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation/site-only or former-ignored-only change — expensive lanes skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------------
  # Python tests
  #
  # Parallel execution with pytest-xdist (-n auto). The test-isolation work
  # is done: every conftest (root + core/core + core/data) gives each xdist
  # worker its own FLINTTRADE_WORKSPACE_DIR keyed on PYTEST_XDIST_WORKER, so
  # the per-worker SQLite/DuckDB files never collide (this fixed the
  # _duckdb.IOException that previously forced serial runs). --timeout=60
  # catches hangs; pytest-randomly randomises order to surface
  # order-dependent flakes early.
  # ----------------------------------------------------------------------
  python-tests:
    # Skip the matrix on draft PRs — open as draft, push iteratively without
    # CI cost, then mark ready-for-review when you want CI to run.
    #
    # Deliberately NOT gated on `changed-surfaces`: this is the only job that
    # runs tests/test_windows_command_docs.py, so it has to run on exactly the
    # doc-only change it guards.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Runaway guard. The whole suite finishes well inside this; the cap stops
    # a hung job from idling up to the 6-hour runner default (the over-usage
    # signal that tripped Actions in the first place).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # SC-07: hash-verified install only. uv sync --frozen installs the locked
      # workspace + dev group from uv.lock — never an unhashed requirements.txt.
      - run: uv sync --frozen
      - name: Verify pre-restructure baseline artefacts
        run: |
          uv run python - <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path("flinttrade-design/baselines/MANIFEST.json").read_text())
          missing = []
          for artefact in manifest["artefacts"]:
              if not any(pathlib.Path(path).exists() for path in artefact["paths"]):
                  missing.append(artefact["id"])
          if missing:
              print("missing baseline artefacts:", ", ".join(missing))
              sys.exit(1)
          print("baseline artefacts OK:", ", ".join(a["id"] for a in manifest["artefacts"]))
          PY
      - name: Workspace migration round-trip test
        run: |
          uv run python -m pytest packages/core/core/tests/test_workspace_migrations.py -v --import-mode=importlib
          uv run python - <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "packages/core/core/src")
          from flinttrade_core.workspace_migrations import WORKSPACE_VERSION, run_migrations

          with tempfile.TemporaryDirectory() as d:
              Path(d, "workspace.json").write_text(json.dumps({"version": "0.5.2", "modules": {"ai": True}}))
              result = run_migrations(Path(d))
              on_disk = json.loads(Path(d, "workspace.json").read_text())
              assert result == on_disk, "atomic persist did not happen"
              # Pin against the module constant, not a literal, so a workspace
              # version bump cannot silently strand this inline check again.
              assert result["version"] == WORKSPACE_VERSION
              assert result["brokers"]["execution"]["default"] == "openalgo:default"
          PY
      # --timeout-method=thread uses a watchdog thread + _thread.interrupt_main()
      # instead of SIGALRM. SIGALRM can't reliably interrupt CPython's
      # thread.join() on Linux (the C wait loop doesn't propagate EINTR), which
      # is how a single bad thread cleanup deadlocks the whole job until the
      # 6-hour runner timeout. Watchdog method works regardless. See the
      # PositionWatcher fix in packages/services/ditto/src/mirror.py for the original
      # hang vector.
      # scripts/__tests__ is listed explicitly: it matches neither glob, so its
      # 114 tests ran in no lane at all and one of them had been failing at head.
      - run: uv run python -m pytest packages/*/*/tests/ tests/ scripts/__tests__/ -n auto -v --tb=short --import-mode=importlib --timeout=60 --timeout-method=thread
      # Lint path: this used to be `packages/*/*/src/` only, which was NARROWER
      # than the documented gate - `scripts/ft.py lint` and docs/CI.md both run
      # `ruff check packages/ tests/` - so the one job that carries the lint gate
      # never saw the F821/F401 import-NameError class in any test file. Now
      # identical to the local command, so local green means CI green.
      # See the dated per-file-ignores in pyproject.toml for the measured
      # modern-rule debt that the test trees still carry.
      - run: uv run ruff check packages/ tests/ --output-format=github
      # Fail-closed half of the Node-release-key guard. `--days 0` narrows the
      # check to conditions that are already broken - an expired or revoked key,
      # a mirrored key that no longer matches the pinned keySha256, a checksum
      # file with no GOODSIG - so a genuinely unverifiable bootstrap cannot merge.
      # `--offline` keeps it network-free and therefore safe on every PR.
      #
      # The 30-day EXPIRY WARNING deliberately does NOT live here: it belongs on
      # the daily schedule in key-freshness.yml. A warning window in this lane
      # would redden every unrelated pull request for up to a month while the
      # refresh (a version bump plus a mirrored key swap) was arranged.
      - name: Pinned Node release key is not expired or revoked
        run: uv run python scripts/check-node-release-key-freshness.py --offline --days 0
      # NOTE: `scripts/check-terminal-type-safety.py` used to run here, matching
      # regular expressions for explicit `any` and suppression pragmas. It missed
      # `type Payload = any` — the most obvious spelling of the thing it banned —
      # along with unions, intersections, function-type return positions and
      # `keyof any`, because an alias body carries none of the punctuation the
      # patterns keyed off. Both checks are now AST rules in
      # packages/apps/terminal/eslint-local-rules.mjs, enforced by the "Terminal
      # lint gate" step in node-core-tests, which is ungated exactly like this
      # job, so the gate runs on the same set of pushes it always did.
      # tests/test_terminal_lint_gate_wiring.py fails if that step goes away.

  # NOTE: macOS and Windows cross-platform checks used to run on every push +
  # PR with `continue-on-error: true` (cosmetic — never gated anything). On
  # GitHub-hosted runners macOS costs 10× and Windows 2× the Linux minute
  # rate, so a single push burned ≈13× the minutes of a Linux-only run for
  # signal that nobody actioned on. Moved to a dedicated weekly nightly
  # workflow (`.github/workflows/nightly-cross-platform.yml`) on a cron
  # schedule + manual `workflow_dispatch`. If a cross-platform regression
  # surfaces in the weekly run, fix-it-then commit; per-push doesn't need
  # the matrix.

  # Ungated like python-tests: cheap, and it is the lane that would catch a
  # documentation or copy change that broke the terminal's own snapshots.
  # (The site's own suite — including desktop-copy.test.ts, which pins the
  # canonical one-liners — runs in site.yml, which triggers on docs/** and
  # packages/apps/site/**.)
  node-core-tests:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: TypeScript strict check
        run: pnpm --dir packages/apps/terminal exec tsc --noEmit
      # Four rules, all of them things tsc cannot see. react-hooks/rules-of-hooks
      # + exhaustive-deps catch the two runtime faults — a conditional hook call,
      # and a dependency array that lets a widget act on a stale price.
      # local/no-explicit-any + local/no-ts-suppression carry the house rules that
      # `strict` permits by design: an explicit `any`, and a suppression pragma.
      # The latter two replaced a regex script that missed `type Payload = any`.
      - name: Terminal lint gate (hooks, no explicit `any`, no suppressions)
        run: pnpm --dir packages/apps/terminal run lint
      - name: Run core tests
        run: pnpm --dir packages/apps/terminal exec vitest run --pool=forks --maxWorkers=1 --no-file-parallelism src/lib/ src/stores/ src/atoms/ src/services/ src/test-utils/ src/hooks/ src/layout/ src/admin/ src/providers/ src/__tests__/
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      - name: Build check
        run: pnpm --dir packages/apps/terminal run build

  node-widget-tests-1:
    needs: changed-surfaces
    if: github.event.pull_request.draft != true && needs.changed-surfaces.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run trading + utility A-H widget tests
        run: pnpm --dir packages/apps/terminal exec vitest run --pool=forks --maxWorkers=1 --no-file-parallelism src/widgets/trading/ src/widgets/utility/AIAdvisor/ src/widgets/utility/Alerts/ src/widgets/utility/AuditTrail/ src/widgets/utility/Calculator/ src/widgets/utility/IndexStrip/ src/widgets/utility/CurrencyConverter/ src/widgets/utility/EarningsCalendar/ src/widgets/utility/EconomicCalendar/ src/widgets/utility/ExpiryCountdown/ src/widgets/utility/FundingRate/
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  node-widget-tests-2a:
    needs: changed-surfaces
    if: github.event.pull_request.draft != true && needs.changed-surfaces.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run utility widget tests (M-S)
        run: pnpm --dir packages/apps/terminal exec vitest run --pool=forks --maxWorkers=1 --no-file-parallelism src/widgets/utility/MarketClock/ src/widgets/utility/News/
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  node-widget-tests-2b:
    needs: changed-surfaces
    if: github.event.pull_request.draft != true && needs.changed-surfaces.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run utility widget tests (S-W, one at a time)
        run: |
          cd packages/apps/terminal
          FAIL=0
          # TradeIdea excluded: OOMs at 4GB+ heap (vitest module resolution overhead).
          # Passes locally with --max-old-space-size=8192. CI runner limited to 7GB total.
          for d in StrategyTemplates TickSpeed Ticker Watchlist AIBackends AITeam Obsidian TradeJournal; do
            echo "::group::Testing $d"
            npx vitest run --pool=forks --maxWorkers=1 --no-file-parallelism "src/widgets/utility/$d/" || FAIL=1
            echo "::endgroup::"
          done
          exit $FAIL
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

  node-widget-tests-3:
    needs: changed-surfaces
    if: github.event.pull_request.draft != true && needs.changed-surfaces.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run analysis + routes + tools + components + chrome + orders/account tests
        run: pnpm --dir packages/apps/terminal exec vitest run --pool=forks --maxWorkers=1 --no-file-parallelism src/widgets/analysis/ src/routes/ src/tools/ src/components/ src/chrome/ src/widgets/orders/ src/widgets/account/
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  secrets-check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Lightweight grep scan — far quicker than this, but the cap is the guard.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          FOUND=0
          for p in 'BROKER_API_KEY\s*=\s*['"'"'"][^'"'"'"]+['"'"'"]' 'sk-[a-zA-Z0-9]{20,}'; do
            grep -rn "$p" --include="*.py" --include="*.js" --include="*.toml" . 2>/dev/null | grep -v ".env.example" && FOUND=1
          done
          [ "$FOUND" -eq 1 ] && exit 1 || echo "✅ No secrets"

  # The Rust ticks crate (tick-level backtest simulator) carries real unit tests
  # that no other job runs — cargo audit (supply-chain.yml) checks advisories,
  # not behaviour. This lane compiles and runs them. paths-ignore skips the
  # whole workflow on doc-only pushes; on a code push this is a per-push Rust
  # compile, kept cheap by the cargo cache.
  rust-ticks-tests:
    needs: changed-surfaces
    if: github.event.pull_request.draft != true && needs.changed-surfaces.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/core/ticks
      - run: cargo test --manifest-path packages/core/ticks/Cargo.toml

  # Electron owns desktop process supervision, renderer isolation and native
  # lifecycle. Exercise the complete Electron suite and a hardened Linux
  # directory package on every non-draft code change; the weekly workflow
  # covers platform-specific packaging.
  electron-desktop-tests:
    needs: changed-surfaces
    if: github.event.pull_request.draft != true && needs.changed-surfaces.outputs.code == 'true'
    # ubuntu-24.04, not 22.04. The 22.04 pin was inherited from the retired Tauri
    # lane, where it was a stated choice: that job compiled the same crate the
    # release matrix built, on the 22.04 glibc/webkit support floor. The Electron
    # cutover kept the runner and lost the reason.
    #
    # The reason no longer applies here. This job packages `--dir` and verifies
    # the security contract; it publishes nothing, so the glibc its native addon
    # links against never reaches a user. flint.toml declares
    # os_requires = "Ubuntu 24.04 LTS or any platform providing Python >= 3.12",
    # so per-push CI running on 22.04 was testing below the project's own floor.
    #
    # desktop-release.yml's Linux build legs DO stay on ubuntu-22.04/-arm, and
    # deliberately: they compile flinttrade-fs-promoter.node with /usr/bin/cc and
    # ship it inside the AppImage, so the build host's glibc becomes the
    # installer's real floor. That is a distribution decision, not a test one.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Electron TypeScript strict check
        run: pnpm --filter @flinttrade/desktop typecheck
      - name: Full Electron Vitest suite
        run: pnpm --filter @flinttrade/desktop test:electron
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      - name: Bundle Electron main and preload
        run: pnpm --filter @flinttrade/desktop bundle
      - name: Exercise native POSIX no-replace promotion
        run: pnpm --filter @flinttrade/desktop exec node scripts/run-required-atomic-promoter-test.mjs
      - name: Package Linux Electron directory
        run: pnpm --filter @flinttrade/desktop exec electron-builder --dir --linux --x64 --publish never
      - name: Verify packaged Electron security contract
        run: pnpm --filter @flinttrade/desktop verify:package

  terminal-e2e-infra-self-tests:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check Playwright infrastructure
        run: pnpm --dir packages/apps/terminal run e2e:infra:typecheck
      - name: Lint Playwright infrastructure
        run: pnpm --dir packages/apps/terminal run e2e:infra:lint
      - name: Install the lockfile-pinned Playwright Chromium build
        run: pnpm --dir packages/apps/terminal exec playwright install --with-deps chromium
      - name: Run network-independent fail-closed self-tests (Chromium-only)
        run: pnpm --dir packages/apps/terminal exec playwright test e2e/infra-self-tests.spec.ts --config=playwright.infra.config.ts --project=chromium --reporter=github --workers=1 --retries=0
        env:
          CI: true
      - name: Run selected fail-closed product journeys (Chromium-only)
