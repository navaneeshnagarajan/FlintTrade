name: Site

on:
  # Test owns triggers, concurrency and the shared affected-surface plan.
  workflow_call:

# Least-privilege default: this workflow only reads the repo to build/test the site.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  site:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/apps/site run typecheck
      - run: pnpm --dir packages/apps/site run test
      - run: pnpm --dir packages/apps/site run build
