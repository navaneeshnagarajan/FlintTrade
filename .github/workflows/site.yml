name: Site

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - 'packages/apps/site/**'
      - 'packages/apps/terminal/**'
      - 'packages/core/design-system/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'docs/**'
      - 'packages/*/*/README.md'
      - '.github/workflows/site.yml'
  push:
    branches: [main, dev]
    paths:
      - 'packages/apps/site/**'
      - 'packages/apps/terminal/**'
      - 'packages/core/design-system/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'docs/**'
      - 'packages/*/*/README.md'
      - '.github/workflows/site.yml'

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this workflow only reads the repo to build/test the site.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  site:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/apps/site run typecheck
      - run: pnpm --dir packages/apps/site run test
      - run: pnpm --dir packages/apps/site run build
