name: Nightly Cross-Platform Tests

# Cross-platform validation that used to run on every push (see test.yml).
# Moved to a weekly cron on 2026-05-19 because the macOS runner costs 10×
# and the Windows runner costs 2× the Linux minute rate; with both gates
# marked `continue-on-error: true` they never blocked a commit, so per-push
# execution was burning minutes without delivering signal.
#
# A weekly run on Sunday at 03:00 UTC (08:30 IST Sunday) is enough to
# catch slow-burn platform regressions before they pile up; manual
# `workflow_dispatch` is available for any contributor who needs an
# on-demand check (e.g. after merging a Windows-path-handling change).

on:
  schedule:
    - cron: '0 3 * * 0'    # Sunday 03:00 UTC = 08:30 IST Sunday
  workflow_dispatch:        # Allow manual trigger from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least-privilege token. These jobs only check out and run the test suite
# on macOS/Windows — they never write to the repo — so a read-only
# GITHUB_TOKEN is all they need.
permissions:
  contents: read

# Concurrency: only one nightly run at a time. A manual dispatch while
# a scheduled run is in flight cancels the scheduled one so the manual
# one wins.
concurrency:
  group: nightly-cross-platform
  cancel-in-progress: true

jobs:
  python-tests-macos:
    runs-on: macos-latest
    continue-on-error: true
    # Runaway guard on the priciest runner (macOS bills 10× Linux). Caps a
    # hung cross-platform job long before the 6-hour runner default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --frozen          # SC-07: hash-verified install
      - run: uv run python -m pytest packages/*/*/tests/ tests/ -n auto -v --tb=short --import-mode=importlib --timeout=60

  python-tests-windows:
    runs-on: windows-latest
    continue-on-error: true
    # Runaway guard on the Windows runner (bills 2× Linux).
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --frozen          # SC-07: hash-verified install
      - run: uv run python -m pytest packages/*/*/tests/ tests/ -n auto -v --tb=short --import-mode=importlib --timeout=60 -k "not resource_module"

  # Canary for the newest-Ubuntu user base (maintainer develops on 26.04).
  # The ubuntu-26.04 hosted runner is still a GitHub preview image, so this
  # leg is fail-soft; promote test.yml only when ubuntu-latest moves.
  python-tests-ubuntu-2604:
    runs-on: ubuntu-26.04
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --frozen          # SC-07: hash-verified install
      - run: uv run python -m pytest packages/*/*/tests/ tests/ -n auto -v --tb=short --import-mode=importlib --timeout=60

  desktop-electron-package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Bundle Electron main and preload
        run: pnpm --filter @flinttrade/desktop bundle
      - name: Exercise native POSIX no-replace promotion
        if: runner.os != 'Windows'
        run: pnpm --filter @flinttrade/desktop exec node scripts/run-required-atomic-promoter-test.mjs
      - name: Exercise native Windows source promotion and preserve-only cleanup
        if: runner.os == 'Windows'
        run: pnpm --filter @flinttrade/desktop test:windows-source-fs
      - name: Package macOS Electron directory
        if: runner.os == 'macOS'
        run: >-
          pnpm --filter @flinttrade/desktop exec electron-builder --dir --mac --universal --publish never
          --config.mac.identity=- --config.mac.hardenedRuntime=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package Windows Electron directory
        if: runner.os == 'Windows'
        run: pnpm --filter @flinttrade/desktop exec electron-builder --dir --win --x64 --publish never
      - name: Package Linux Electron directory
        if: runner.os == 'Linux'
        run: pnpm --filter @flinttrade/desktop exec electron-builder --dir --linux --x64 --publish never
      - name: Verify packaged Electron security contract
        run: pnpm --filter @flinttrade/desktop verify:package
