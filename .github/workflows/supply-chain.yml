name: Supply Chain

# Full supply-chain gate matrix (sub-spec §12.1). Replaces the earlier 3-step ad-hoc
# job. Consolidates the python/rust/node audits, licence + provenance checks, NOTICE
# drift, install enforcement, Windows ACL hardening, cross-platform smoke, lockfile
# drift, and the CLA GPG binding (external forks only).

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'flinttrade-design/**'   # ME35
      - '.local/**'              # ME35
      - 'NOTICE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'flinttrade-design/**'   # ME35
      - '.local/**'              # ME35
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: "0 3 * * *"          # 03:00 UTC = 08:30 IST (per §3.4)
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# §14.3 CI env allowlist — FLINTTRADE_CI activates the no-broker-creds gate; every broker
# credential var is explicitly emptied so a leaked higher-scope secret cannot inherit.
env:
  FLINTTRADE_CI: "1"
  DHAN_ACCESS_TOKEN: ""
  DHAN_API_KEY: ""
  DHAN_API_SECRET: ""
  DHAN_CLIENT_ID: ""
  DHAN_TOKEN: ""
  UPSTOX_API_KEY: ""
  UPSTOX_API_SECRET: ""
  UPSTOX_ACCESS_TOKEN: ""
  UPSTOX_REFRESH_TOKEN: ""
  UPSTOX_TOKEN: ""
  KOTAK_NEO_CONSUMER_KEY: ""
  KOTAK_NEO_CONSUMER_SECRET: ""
  KOTAK_NEO_MPIN: ""
  KOTAK_NEO_TOTP: ""
  KOTAK_NEO_TOTP_SECRET: ""
  KOTAK_NEO_ACCESS_TOKEN: ""
  KOTAK_NEO_SESSION_TOKEN: ""
  KOTAK_NEO_TOKEN: ""
  INDMONEY_API_KEY: ""
  INDMONEY_API_SECRET: ""
  INDMONEY_ACCESS_TOKEN: ""
  INDMONEY_TOKEN: ""
  KITE_API_KEY: ""
  KITE_API_SECRET: ""
  KITE_ACCESS_TOKEN: ""
  ZERODHA_API_KEY: ""
  ZERODHA_ACCESS_TOKEN: ""

jobs:
  python-audit:
    name: Python audit (pip-audit)
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.8" }
      - run: pip install --require-hashes -r supply-chain/audit-tooling.lock
      - name: pip-audit (allowlist + offline fallback)
        run: python scripts/pip-audit-with-allowlist.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pip-audit-report, path: pip-audit-report.json, retention-days: 30 }

  rust-audit:
    name: Rust audit (cargo audit)
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""        # honour packages/core/ticks/rust-toolchain.toml
      - run: cargo install cargo-audit --locked --version 0.21.0
      - name: cargo audit
        working-directory: packages/core/ticks
        run: cargo audit --deny warnings --json > cargo-audit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cargo-audit-report, path: packages/core/ticks/cargo-audit-report.json }

  node-audit:
    name: Node audit (pnpm audit)
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.8" }
      - run: pip install --require-hashes -r supply-chain/audit-tooling.lock
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: corepack enable && corepack prepare "$(jq -r .packageManager package.json)" --activate
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (allowlist)
        run: python scripts/pnpm-audit-with-allowlist.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pnpm-audit-report, path: pnpm-audit-report.json }

  brokers-lock-integrity:
    name: brokers.lock <-> requirements.lock integrity
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.8" }
      - name: check brokers.lock
        run: python scripts/check-brokers-lock.py

  broker-sdk-licences:
    name: broker SDK licence compatibility
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.8" }
      - run: pip install --require-hashes -r supply-chain/audit-tooling.lock
      - run: pip install --require-hashes -r requirements.lock   # so wheel metadata cross-check fires
      - name: check broker SDK licences
        run: python scripts/check-broker-sdk-licences.py

  transitive-licences:
    name: transitive dependency licence sweep
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    continue-on-error: true       # informational; does not block merge in v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.8" }
      - run: pip install --require-hashes -r supply-chain/audit-tooling.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: pip-licenses --from=mixed --order=license --format=json --output-file=supply-chain/transitive-licences.json
      - run: python scripts/check-transitive-licences.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: transitive-licences-report, path: supply-chain/transitive-licences.json }

  notice-drift:
    name: NOTICE drift check
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.8" }
      - name: NOTICE up-to-date
        run: python scripts/generate-notice.py --check

  provenance-grep:
    name: dependency provenance (no git/file/tarball deps)
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.8" }
      - name: check no git deps
        run: python scripts/check-no-git-deps.py

  install-enforcement:
    name: hashed-pip + frozen-lockfile grep
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.8" }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -m pytest tests/test_no_unhashed_pip_install.py tests/test_pnpm_install_frozen.py -v

  windows-acl-test:
    name: Windows secret-file ACL hardening (HI18)
    runs-on: windows-latest
    if: ${{ !github.event.pull_request.draft }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.8" }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: ACL test
        run: uv run python -m pytest tests/test_secure_file_windows_acl.py -v

  cross-platform-smoke:
    name: lockfile install smoke (${{ matrix.os }})
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.8" }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -c "import flinttrade_core; print(flinttrade_core.__file__)"

  uv-lock-export-drift:
    name: uv.lock <-> requirements.lock drift check
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.8" }
      - uses: astral-sh/setup-uv@v6
      - run: python scripts/check-uv-lock-export-drift.py

  cla-gpg-binding:
    name: CLA GPG fingerprint binding (Identity H8)
    runs-on: ubuntu-latest
    # only fires on external PRs (forks); the founder's own branches are auto-attested
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history for GPG signature verification
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.8" }
      - run: pip install --require-hashes -r supply-chain/audit-tooling.lock
      - run: sudo apt-get install -y gnupg
      - run: python scripts/check-cla-gpg-binding.py
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
