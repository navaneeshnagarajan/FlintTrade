name: Supply Chain

# Full supply-chain gate matrix (sub-spec §12.1). Replaces the earlier 3-step ad-hoc
# job. Consolidates the python/rust/node audits, licence + provenance checks, NOTICE
# drift, install enforcement, Windows ACL hardening, cross-platform smoke, lockfile
# drift, and the CLA GPG binding (external forks only).
#
# CI right-sizing: the Linux audits run per-push/PR; the expensive cross-platform jobs
# (windows-acl-test, cross-platform-smoke) run ONLY on the weekly cron + workflow_dispatch,
# never on push/pull_request. Every job carries timeout-minutes as a runaway guard.

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'flinttrade-design/**'   # ME35
      - '.local/**'              # ME35
      # NB: no ignore for 'notice'/'notice.generated' — a notice-only commit MUST
      # still run the NOTICE-drift gate below (a hand-edited notice has to fail CI).
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'flinttrade-design/**'   # ME35
      - '.local/**'              # ME35
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: "0 3 * * 1"          # weekly Monday 03:00 UTC = 08:30 IST (per §3.4)
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# §14.3 CI env allowlist — FLINTTRADE_CI activates the no-broker-creds gate; every broker
# credential var is explicitly emptied so a leaked higher-scope secret cannot inherit.
env:
  FLINTTRADE_CI: "1"
  OPENALGO_API_KEY: ""
  DHAN_ACCESS_TOKEN: ""
  DHAN_API_KEY: ""
  DHAN_API_SECRET: ""
  DHAN_CLIENT_ID: ""
  DHAN_TOKEN: ""
  UPSTOX_API_KEY: ""
  UPSTOX_API_SECRET: ""
  UPSTOX_ACCESS_TOKEN: ""
  UPSTOX_REFRESH_TOKEN: ""
  UPSTOX_TOKEN: ""
  KOTAK_NEO_CONSUMER_KEY: ""
  KOTAK_NEO_CONSUMER_SECRET: ""
  KOTAK_NEO_MPIN: ""
  KOTAK_NEO_TOTP: ""
  KOTAK_NEO_TOTP_SECRET: ""
  KOTAK_NEO_ACCESS_TOKEN: ""
  KOTAK_NEO_SESSION_TOKEN: ""
  KOTAK_NEO_TOKEN: ""
  INDMONEY_API_KEY: ""
  INDMONEY_API_SECRET: ""
  INDMONEY_ACCESS_TOKEN: ""
  INDMONEY_TOKEN: ""
  KITE_API_KEY: ""
  KITE_API_SECRET: ""
  KITE_ACCESS_TOKEN: ""
  ZERODHA_API_KEY: ""
  ZERODHA_ACCESS_TOKEN: ""

jobs:
  # Consolidated Linux Python gate — pip-audit + brokers.lock integrity + broker SDK
  # licences + NOTICE drift + provenance + install enforcement + uv.lock drift, as
  # ordered steps sharing a single checkout/setup. Previously eight separate jobs.
  python-audit:
    name: Python audit (pip-audit + lock/licence/provenance/install gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v5
      - name: Remove stale pip-audit evidence from checkout
        run: |
          rm -f pip-audit-report.json
          rm -f "${{ runner.temp }}/flinttrade-pip-audit-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - uses: actions/setup-python@v6
        with: { python-version: "3.12.8" }
      - uses: astral-sh/setup-uv@v7
      - run: pip install --require-hashes -r supply-chain/audit-tooling.lock
      - name: pip-audit (allowlist + offline fallback)
        id: pip_audit
        env:
          FLINTTRADE_PIP_AUDIT_REPORT: ${{ runner.temp }}/flinttrade-pip-audit-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: python scripts/pip-audit-with-allowlist.py
      - name: Upload newly generated pip-audit evidence
        uses: actions/upload-artifact@v6
        if: ${{ always() && steps.pip_audit.outcome != 'skipped' }}
        with:
          name: pip-audit-report
          path: ${{ runner.temp }}/flinttrade-pip-audit-${{ github.run_id }}-${{ github.run_attempt }}.json
          retention-days: 30
          if-no-files-found: error
      - name: brokers.lock <-> requirements.lock integrity
        run: python scripts/check-brokers-lock.py
      - name: install runtime deps (so wheel metadata cross-check fires)
        run: pip install --require-hashes -r requirements.lock
      - name: broker SDK licence compatibility
        run: python scripts/check-broker-sdk-licences.py
      - name: NOTICE drift check
        run: python scripts/generate-notice.py --check
      - name: dependency provenance (no git/file/tarball deps)
        run: python scripts/check-no-git-deps.py
      - name: hashed-pip + frozen-lockfile enforcement
        run: |
          uv sync --frozen
          uv run python -m pytest tests/test_no_unhashed_pip_install.py tests/test_pnpm_install_frozen.py -v
      - name: uv.lock <-> requirements.lock drift check
        run: python scripts/check-uv-lock-export-drift.py

  rust-audit:
    name: Rust audit (cargo audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable    # cargo-audit 0.22.x needs a newer compiler than tick-engine's pinned MSRV.
          rustflags: ""
      - run: cargo install cargo-audit --locked --version 0.22.2
      - name: cargo audit (tick engine)
        run: python scripts/cargo-audit-with-allowlist.py --manifest-dir packages/core/ticks --report packages/core/ticks/cargo-audit-report.json
      - name: cargo audit (desktop app)
        run: python scripts/cargo-audit-with-allowlist.py --manifest-dir packages/apps/desktop/src-tauri --report packages/apps/desktop/src-tauri/cargo-audit-report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cargo-audit-reports
          path: |
            packages/core/ticks/cargo-audit-report.json
            packages/apps/desktop/src-tauri/cargo-audit-report.json

  node-audit:
    name: Node audit (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12.8" }
      - run: pip install --require-hashes -r supply-chain/audit-tooling.lock
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (allowlist)
        run: python scripts/pnpm-audit-with-allowlist.py
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: pnpm-audit-report, path: pnpm-audit-report.json }

  transitive-licences:
    name: transitive dependency licence sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !github.event.pull_request.draft }}
    continue-on-error: true       # informational; does not block merge in v1.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12.8" }
      - run: pip install --require-hashes -r supply-chain/audit-tooling.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: pip-licenses --from=mixed --order=license --format=json --output-file=supply-chain/transitive-licences.json
      - run: python scripts/check-transitive-licences.py
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: transitive-licences-report, path: supply-chain/transitive-licences.json }

  # Cross-platform jobs are expensive (macOS billed 10x, Windows 2x). They run ONLY on the
  # weekly cron + manual dispatch — never on push/pull_request — to keep the per-push CI
  # footprint Linux-only.
  windows-acl-test:
    name: Windows secret-file ACL hardening (HI18)
    runs-on: windows-latest
    timeout-minutes: 45
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !github.event.pull_request.draft }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12.8" }
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: ACL test
        run: uv run python -m pytest tests/test_secure_file_windows_acl.py -v

  cross-platform-smoke:
    name: lockfile install smoke (${{ matrix.os }})
    timeout-minutes: 45
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12.8" }
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run python -c "import flinttrade_core; print(flinttrade_core.__file__)"

  cla-gpg-binding:
    name: CLA GPG fingerprint binding (Identity H8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # only fires on external PRs (forks); the founder's own branches are auto-attested
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }   # full history for GPG signature verification
      - uses: actions/setup-python@v6
        with: { python-version: "3.12.8" }
      - run: pip install --require-hashes -r supply-chain/audit-tooling.lock
      - run: sudo apt-get install -y gnupg
      - run: python scripts/check-cla-gpg-binding.py
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
