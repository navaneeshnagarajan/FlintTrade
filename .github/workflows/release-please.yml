# Release automation.
#
# On every push to main, release-please maintains a release PR that bumps the
# canonical root package.json and writes the changelog.md section from
# Conventional Commits. A follow-up step propagates the version across the
# repository's ~25-file release contract via scripts/apply-version.py and
# pushes the propagation into the same PR.
#
# Merging the release PR makes release-please create the GitHub release and
# the v* tag. Tags created with GITHUB_TOKEN do not trigger tag-push
# workflows, so this workflow explicitly dispatches desktop-release.yml with
# the new tag instead.

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  propagate-version:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Propagate the bumped version across the release contract
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          python3 scripts/apply-version.py "v${version}"
          # The pyproject bumps change every workspace member's recorded
          # version in uv.lock; refresh it here or the first post-merge
          # `uv sync` drifts the lock on the developer machine instead.
          uv lock
          uv run python scripts/generate-notice.py
      - name: Commit the propagation into the release PR
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Release contract already consistent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add docs/releases/
          git commit -m "chore(release): propagate the version across the release contract"
          git push

  # Runs on the release PR are approval-gated because its author is
  # github-actions[bot]; without this job every push left a stub run waiting
  # for a manual "Approve and run" click. Approve the current head's runs and
  # delete the superseded stubs so the Actions view stays clean.
  approve-release-pr-ci:
    needs: [release-please, propagate-version]
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Approve current-head CI, delete superseded stubs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ needs.release-please.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["headBranchName"])')"
          number="$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])')"
          # The gated runs are created asynchronously and NOT all at once
          # (observed: Supply Chain appeared seconds before Site/Test), so
          # sweep for the whole window — never exit on the first approval.
          total=0
          for attempt in $(seq 1 8); do
            head_sha="$(gh api "repos/$REPO/pulls/$number" --jq '.head.sha')"
            runs="$(gh api "repos/$REPO/actions/runs?branch=$branch&status=action_required&per_page=50" \
              --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')"
            while read -r run_id run_sha; do
              [ -n "$run_id" ] || continue
              if [ "$run_sha" = "$head_sha" ]; then
                gh api -X POST "repos/$REPO/actions/runs/$run_id/approve" >/dev/null \
                  && { total=$((total+1)); echo "approved run $run_id on $run_sha"; } \
                  || echo "could not approve run $run_id (needs a manual click)"
              else
                gh api -X DELETE "repos/$REPO/actions/runs/$run_id" >/dev/null \
                  && echo "deleted superseded stub $run_id ($run_sha)" \
                  || echo "could not delete stub $run_id"
              fi
            done <<< "$runs"
            sleep 15
          done
          echo "Sweep complete: approved $total run(s) for $branch."

  dispatch-installers:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build installers for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run desktop-release.yml \
            --repo "${{ github.repository }}" \
            -f tag="${{ needs.release-please.outputs.tag_name }}"
