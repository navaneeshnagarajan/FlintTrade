# Dependabot version updates. Security updates are enabled separately in the
# repository security settings; this file adds scheduled version-bump PRs for the
# monorepo's four ecosystems. Staggered weekdays and grouped version updates
# reduce simultaneous CI runs. Security updates remain managed separately.
version: 2
updates:
  # Pinned GitHub Actions (all workflows pin by commit SHA) — keep them current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # JavaScript/TypeScript pnpm workspace (terminal, site, desktop, design-system).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      js-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # These sets pin each other as exact peers, and Dependabot updates one
      # package at a time, so the install never resolves. Bump each set by
      # hand in one change. Security updates still apply.
      - dependency-name: "fumadocs-core"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "fumadocs-ui"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "fumadocs-mdx"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "electron-builder"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "electron-builder-squirrel-windows"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # Python uv workspace (13 packages via the root uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      py-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Broker SDKs are pinned in brokers.lock and moved by the Broker SDK
      # freshness workflow. Two of them install from git sources that
      # Dependabot cannot resolve.
      - dependency-name: "dhanhq"
      - dependency-name: "upstox-python-sdk"
      - dependency-name: "kotakneoapi"
      - dependency-name: "growwapi"
      # Newer yfinance needs certifi 2026 through curl-cffi, and growwapi
      # 1.5.0 caps certifi below 2026. Lift this once growwapi allows it.
      - dependency-name: "yfinance"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # Pinned in several workspace members or in an optional extra.
      # Dependabot edits one member at a time, so the lock never resolves.
      # Bump these by hand across every member in one change. Security
      # updates still apply.
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "pyotp"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "pyarrow"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # Rust/PyO3 ticks crate.
  - package-ecosystem: "cargo"
    directory: "/packages/core/ticks"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]
