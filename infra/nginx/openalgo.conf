# FlintTrade nginx reverse proxy — see docs/ARCHITECTURE.md for blue-green config
server {
    listen 5000;
    location / { proxy_pass http://127.0.0.1:5001; proxy_set_header Host $host; }
    location /ws { proxy_pass http://127.0.0.1:5001; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
}
