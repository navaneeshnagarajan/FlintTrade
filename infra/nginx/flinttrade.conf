# =============================================================================
# FlintTrade Nginx Configuration — Reverse Proxy + Static File Server
# =============================================================================
#
# Architecture:
#   /            → React SPA (static files from terminal build)
#   /api/        → OpenAlgo REST API (port 5000)
#   /ft-api/     → FlintTrade backend API (port 5100)
#   /ws          → OpenAlgo WebSocket (port 8765)
#   /monitoring/ → Uptime Kuma (port 3001)
#   /errors/     → Glitchtip (port 8000)
#   /logs/       → VictoriaLogs (port 9090)
#   /metrics/    → Netdata (port 19999)
#
# INSTALL:
#   Docker: mounted automatically via docker-compose.yml
#   Bare metal: sudo cp flinttrade.conf /etc/nginx/sites-available/flinttrade
#               sudo ln -s /etc/nginx/sites-available/flinttrade /etc/nginx/sites-enabled/
#               sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ---------------------------------------------------------------------------
# Rate limiting zones — protect against brute-force and API abuse
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_general:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api_orders:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_smartorders:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# ---------------------------------------------------------------------------
# Upstream definitions — all services bind to 127.0.0.1
# ---------------------------------------------------------------------------
upstream openalgo {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream flinttrade {
    server 127.0.0.1:5100;
    keepalive 16;
}

upstream openalgo_ws {
    server 127.0.0.1:8765;
}

upstream uptime_kuma {
    server 127.0.0.1:3001;
}

upstream glitchtip {
    server 127.0.0.1:8000;
}

upstream victorialogs {
    server 127.0.0.1:9090;
}

upstream netdata {
    server 127.0.0.1:19999;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect (uncomment when SSL is provisioned)
# ---------------------------------------------------------------------------
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$host$request_uri;
# }

# ---------------------------------------------------------------------------
# Main server block
# ---------------------------------------------------------------------------
server {
    listen 80;
    # listen 443 ssl http2;
    server_name _;

    # -----------------------------------------------------------------------
    # SSL configuration (uncomment when Let's Encrypt certificates are ready)
    # -----------------------------------------------------------------------
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;
    # ssl_session_tickets off;
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # -----------------------------------------------------------------------
    # Security headers — HSTS, XSS protection, content security
    # -----------------------------------------------------------------------
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self';" always;

    # HSTS — only sent over HTTPS to avoid breaking plain HTTP during development
    if ($scheme = https) {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # -----------------------------------------------------------------------
    # Gzip compression — reduce bandwidth for API responses and static assets
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # -----------------------------------------------------------------------
    # Large buffer sizes — required for JWT auth tokens and API payloads
    # -----------------------------------------------------------------------
    client_max_body_size 1m;
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;
    large_client_header_buffers 4 16k;

    # -----------------------------------------------------------------------
    # Common proxy headers (shared across all proxy locations)
    # -----------------------------------------------------------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ===================================================================
    # React SPA — static files from terminal build
    # ===================================================================
    root /var/www/flinttrade/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively (Vite adds content hashes)
        # NOTE: add_header in a nested block clears parent-level headers,
        # so all security headers must be re-declared here.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            access_log off;
        }
    }

    # ===================================================================
    # OpenAlgo REST API — broker gateway (port 5000)
    # ===================================================================
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://openalgo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Order endpoints — stricter rate limiting (10/s)
    location /api/v1/placeorder {
        limit_req zone=api_orders burst=5 nodelay;

        proxy_pass http://openalgo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/v1/placesmartorder {
        limit_req zone=api_smartorders burst=2 nodelay;

        proxy_pass http://openalgo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ===================================================================
    # FlintTrade Auth API — strict rate limiting (brute-force protection)
    # Must appear before the general /ft-api/ block.
    # ===================================================================
    location /ft-api/v1/auth/ {
        limit_req zone=login burst=3 nodelay;

        rewrite ^/ft-api/(.*) /$1 break;
        proxy_pass http://flinttrade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===================================================================
    # FlintTrade Backend API — platform services (port 5100)
    # The /ft-api/ prefix is stripped before forwarding.
    # ===================================================================
    location /ft-api/ {
        limit_req zone=api_general burst=20 nodelay;

        rewrite ^/ft-api/(.*) /$1 break;
        proxy_pass http://flinttrade;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ===================================================================
    # WebSocket — OpenAlgo market data stream (port 8765)
    # ===================================================================
    location /ws {
        proxy_pass http://openalgo_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ===================================================================
    # Monitoring tools — internal services proxied through Nginx
    # All require authentication (handled by each service's own auth)
    # ===================================================================

    # Uptime Kuma — uptime monitoring dashboard
    location /monitoring/ {
        # Restrict to localhost and VPN subnet
        allow 127.0.0.1;
        allow ::1;
        # allow <YOUR_VPN_SUBNET>/24;  # Uncomment + set to restrict to your VPN subnet
        deny all;

        rewrite ^/monitoring/(.*) /$1 break;
        proxy_pass http://uptime_kuma;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Glitchtip — error tracking and crash reporting
    location /errors/ {
        # Restrict to localhost and VPN subnet
        allow 127.0.0.1;
        allow ::1;
        # allow <YOUR_VPN_SUBNET>/24;  # Uncomment + set to restrict to your VPN subnet
        deny all;

        rewrite ^/errors/(.*) /$1 break;
        proxy_pass http://glitchtip;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # VictoriaLogs — log aggregation and search
    location /logs/ {
        # Restrict to localhost and VPN subnet
        allow 127.0.0.1;
        allow ::1;
        # allow <YOUR_VPN_SUBNET>/24;  # Uncomment + set to restrict to your VPN subnet
        deny all;

        rewrite ^/logs/(.*) /$1 break;
        proxy_pass http://victorialogs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Netdata — real-time system performance metrics
    location /metrics/ {
        # Restrict to localhost and VPN subnet
        allow 127.0.0.1;
        allow ::1;
        # allow <YOUR_VPN_SUBNET>/24;  # Uncomment + set to restrict to your VPN subnet
        deny all;

        rewrite ^/metrics/(.*) /$1 break;
        proxy_pass http://netdata;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ===================================================================
    # Let's Encrypt ACME challenge (for certificate renewal)
    # ===================================================================
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ===================================================================
    # Deny access to hidden files and sensitive paths
    # ===================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    access_log /var/log/nginx/flinttrade_access.log;
    error_log /var/log/nginx/flinttrade_error.log warn;
}
