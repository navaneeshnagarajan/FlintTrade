# One-line purpose + key entry points per FlintTrade package.
# Drives generation of packages/<pkg>/README.md via scripts/generate-package-readmes.py.
apps/desktop:
  language: TypeScript + Electron 43.2.0
  purpose: "Sandboxed Electron shell — verifies tools, builds managed local source, supervises its guardian, and provides close-to-tray lifecycle plus four-installer delivery."
  entry_points:
    - "electron/main.ts — singleton, bootstrap, guardian, windows, lifecycle, and updates"
    - "electron/preload.ts — named sandboxed window.flintDesktop bridge"
    - "resources/bootstrap/ — checksum-bound first-run bootstrap entrypoints"
    - "splash/ — local bootstrap and recovery surface"
apps/site:
  language: TypeScript + React 19
  purpose: "Next.js + Fumadocs public website, generated documentation, contribution pages, llms files, and read-only docs MCP."
  entry_points:
    - "src/app/page.tsx — public landing page"
    - "scripts/generate-content.mjs — docs/package/release content generator"
    - "src/lib/mcp/capabilities.ts — docs MCP tools and prompts"
apps/terminal:
  language: TypeScript + React 19
  purpose: "Single-page terminal — FlexLayout workspace with home widgets, tools, routes, and workspace presets."
  entry_points:
    - "src/main.tsx — entry point and route registration"
    - "src/routes/HomeRoute.tsx — dashboard and home widget orchestration"
    - "src/layout/workspacePresets.ts — named workspace presets"
    - "src/services/api.ts — REST + WebSocket client"
core/core:
  language: Python
  purpose: "Flask application, OpenAlgo client (45+ endpoints), config and workspace management, authentication service, and the WSGI prefix-stripper."
  entry_points:
    - "src/flinttrade_core/app.py — Flask app factory + blueprint registration"
    - "src/flinttrade_core/openalgo_client.py — typed wrapper over OpenAlgo's REST API"
    - "src/flinttrade_core/auth_service.py — argon2id passwords + Fernet TOTP + JWT issuance"
    - "src/flinttrade_core/config.py / src/flinttrade_core/workspace.py — env + workspace.json loaders"
core/data:
  language: Python
  purpose: "Tick recorder, append-only hash-chained audit logger, trade logger, DuckDB storage, and a (dormant) QuestDB writer."
  entry_points:
    - "src/flinttrade_data/tick_recorder.py — real-time tick capture to DuckDB / QuestDB"
    - "src/flinttrade_data/audit_logger.py — append-only audit trail"
    - "src/flinttrade_data/questdb_bridge.py — ILP-based ingestion"
core/design-system:
  language: TypeScript + React 19
  purpose: "Shared FlintTrade design tokens, brand primitives, layer scale, motion contracts, and React UI components."
  entry_points:
    - "src/index.ts — public design-system exports"
    - "src/brand/index.ts — logo and brand primitives"
    - "src/layers.ts — shared overlay stacking contract"
    - "src/tokens.css — Tailwind v4 design tokens"
core/historical:
  language: Python
  purpose: "OHLCV downloader, free-data sources (OpenChart + yfinance), DuckDB pipeline, and expiry-tracker for derivatives."
  entry_points:
    - "src/flinttrade_historical/downloader.py — async OHLCV puller with rate-limit aware backoff"
    - "src/flinttrade_historical/free_data.py — OpenChart + yfinance free-data integration"
    - "src/flinttrade_historical/expiry_tracker.py — monthly + weekly expiry calendar for NSE F&O / MCX"
core/indicators:
  language: Python + Numba
  purpose: "Pure-NumPy batch indicators (110 exports; no TA-Lib) plus streaming classes (optional Numba on 3 kernels) and Pine Script conversion."
  entry_points:
    - "src/flinttrade_indicators/__init__.py — 110 public exports (batch kernels, streaming classes, pipeline)"
    - "src/flinttrade_indicators/trend.py — SMA, EMA, MACD, ADX, Supertrend"
    - "src/flinttrade_indicators/momentum.py — RSI, Stochastic, ROC, MFI"
    - "src/flinttrade_indicators/volatility.py — ATR, Bollinger Bands, Keltner Channels"
core/ticks:
  language: Rust + PyO3
  purpose: "High-performance tick-processing engine — Rust core with Python bindings."
  entry_points:
    - "src/lib.rs — PyO3 module entry"
    - "src/types.rs — core Tick / Signal / BacktestResult types"
    - "Cargo.toml — crate metadata and dependencies"
integrations/gateway:
  language: Python
  purpose: "FlintTrade's own native broker gateway — the BrokerAdapter Protocol, safety-gated BrokerRouter, BROKER_CATALOG (35 brokers), an encrypted credential vault, and the WebSocket bridge. OpenAlgo is one optional bridge adapter."
  entry_points:
    - "src/flinttrade_gateway/adapter.py — BrokerAdapter Protocol + BROKER_CATALOG"
    - "src/flinttrade_gateway/router.py — BrokerRouter: dispatches broker writes only after SafetyContext verification"
    - "src/flinttrade_gateway/registry.py — BrokerRegistry over the 35-broker catalogue"
    - "src/flinttrade_gateway/brokers/ — native per-broker adapters (Dhan, OpenAlgo bridge, …) against the BrokerAdapter ABC"
    - "src/flinttrade_gateway/credentials.py — Fernet-encrypted credential vault"
    - "src/flinttrade_gateway/ws_bridge.py — broker WebSocket fan-in to FlintTrade clients"
integrations/webhooks:
  language: Python
  purpose: "HMAC-validated custom webhook intake rail for generic inbound alerts and flows."
  entry_points:
    - "src/flinttrade_webhooks/webhook_receiver.py — HMAC-validated webhook intake"
services/ai:
  language: Python
  purpose: "Local LLM client, RAG pipeline, multi-agent trading team, ML signal generation, and skill swarm."
  entry_points:
    - "src/flinttrade_ai/llm_client.py - multi-provider LLM client (managed Ollama / NVIDIA / OpenAI / Anthropic / Groq)"
    - "src/flinttrade_ai/rag_pipeline.py — optional local SQLite/NumPy retrieval-augmented generation"
    - "src/flinttrade_ai/multi_agent.py — analyst chain + risk debate + ensemble selector"
    - "src/flinttrade_ai/advisor.py — production advisor surface for the AI Centre route"
services/automation:
  language: Python
  purpose: "Cron scheduler, Telegram bot with kill switch, post-market analysis pipelines, voice-order intent extraction."
  entry_points:
    - "src/flinttrade_automation/cron_manager.py — workspace.json-backed scheduled jobs"
    - "src/flinttrade_automation/telegram_bot.py — passive notifications + emergency kill switch"
    - "src/flinttrade_automation/voice_order_bridge.py — speech-to-intent for hands-free order placement"
services/backtest:
  language: Python
  purpose: "Strategy simulator, walk-forward and Monte Carlo testing, portfolio backtester, and 94 strategy templates across 6 categories."
  entry_points:
    - "src/flinttrade_backtest/simulator.py — single-strategy event-driven backtest"
    - "src/flinttrade_backtest/engine.py — entry point used by the Lab route and CLI"
    - "src/flinttrade_backtest/portfolio_backtest.py — multi-strategy portfolio runs via VectorBT"
    - "src/flinttrade_backtest/strategies/ — 94 ready-to-run templates"
services/ditto:
  language: Python
  purpose: "Multi-account orchestration: position mirror, margin calculator, trailing stop-loss, and risk manager (AlgoMirror patterns absorbed in-process)."
  entry_points:
    - "src/flinttrade_ditto/mirror.py — copy trades across accounts with size scaling"
    - "src/flinttrade_ditto/margin_calculator.py — pre-trade margin checks"
    - "src/flinttrade_ditto/trailing_sl.py — dynamic trailing stop-loss"
    - "src/flinttrade_ditto/risk_manager.py — per-account exposure + drawdown limits"
services/engine:
  language: Python
  purpose: "Five-layer order-admission safety, gated scheduled-strategy execution, scheduler, base strategy class, AST-guarded sandbox executor, bracket-order engine, mode guard, and reconciliation."
  entry_points:
    - "src/flinttrade_engine/safety.py — five-layer order-admission safety, explicit L5 kill switch, and account-scoped MTM circuit breaker"
    - "src/flinttrade_engine/strategy_execution.py — gated scheduled-strategy execution through BrokerRouter"
    - "src/flinttrade_engine/strategy.py — base class for live strategies"
    - "src/flinttrade_engine/sandbox_executor.py — user-strategy execution with AST guard"
    - "src/flinttrade_engine/mode_guard.py — server-side Explore / Practice / Live enforcement"
services/journal:
  language: Python
  purpose: "Trade journal service for entries, trade logging, execution-quality analytics, and realised P&L tracking."
  entry_points:
    - "src/flinttrade_journal/trade_journal.py — journal-entry model and storage helpers"
    - "src/flinttrade_journal/order_analytics.py — execution-quality analytics"
    - "src/flinttrade_journal/pnl_tracker.py — realised P&L calculations"
services/screener:
  language: Python
  purpose: "Option chain, OI analysis, PCR, max-pain, futures quadrant, portfolio Greeks, IV smile, fundamental screener, FII / DII tracker, and RRG calculator."
  entry_points:
    - "src/flinttrade_screener/option_chain.py — strike-by-strike chain with Greeks"
    - "src/flinttrade_screener/oi_analysis.py — OI analysis, PCR, and max-pain"
    - "src/flinttrade_screener/rrg.py — Relative Rotation Graph"
    - "src/flinttrade_screener/fundamental_screener.py — Screener.in-style fundamentals"
