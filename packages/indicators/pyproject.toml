[project]
name = "flint-indicators"
version = "0.5.0"
description = "Technical analysis indicators — TA-Lib batch (150+), Numba streaming, Pine Script conversion"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.0",
    "numba>=0.59; extra == 'numba'",
]

[project.optional-dependencies]
talib = ["TA-Lib>=0.4"]
numba = ["numba>=0.59"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
