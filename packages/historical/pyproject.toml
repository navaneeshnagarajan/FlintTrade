[project]
name = "flint-historical"
version = "0.5.0"
description = "OHLCV downloader, free data sources (OpenChart/yfinance/jugaad), DuckDB pipeline, expiry manager"
requires-python = ">=3.12"
dependencies = [
    "flint-core",
    "duckdb>=1.0",
    "flask>=3.0",
    "yfinance>=0.2",
    "jugaad-data>=0.31.0",
    "openchart>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "flint_historical"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
