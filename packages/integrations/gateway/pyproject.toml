[project]
name = "flinttrade-gateway"
version = "0.6.0-beta.13"
description = "Broker adapter interfaces, encrypted credential storage, routing metadata, and WebSocket bridge"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "cryptography>=46.0.0",
    "dhanhq==2.2.0",
    "upstox-python-sdk==2.28.0",
    "neo-api-client==2.0.0",
    "growwapi==1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
pythonpath = ["src", "../.."]
