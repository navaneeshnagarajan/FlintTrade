[project]
name = "flinttrade-webhooks"
version = "0.0.1"
description = "Signed webhook ingestion and alerting"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "flinttrade-automation",
    "flask>=3.0",
    "pydantic>=2.13.5",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_webhooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
