[project]
name = "flinttrade-webhooks"
version = "0.6.0-beta.6"
description = "Webhook ingestion, custom workflow triggers, flow-builder integration, and spreadsheet bridge"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "flinttrade-automation",
    "flask>=3.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Excel live-data bridge (excel_bridge.py) — workbook read/write via openpyxl.
excel = [
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_webhooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
