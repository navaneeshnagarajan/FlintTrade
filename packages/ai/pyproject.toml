[project]
name = "flint-ai"
version = "0.5.0"
description = "LLM client (multi-provider), RAG (ChromaDB), signals, sentiment, MCP bridge, swarm executor"
requires-python = ">=3.12"
dependencies = [
    "flint-core",
    "flint-indicators",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "flask>=3.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "joblib>=1.3",
    "feedparser>=6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "scipy>=1.12",
]
scraping = ["crawl4ai>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
