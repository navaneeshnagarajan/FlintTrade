[project]
name = "flint-core"
version = "0.5.0"
description = "Framework, OpenAlgo client (45+ endpoints), config, workspace, models, exceptions, auth"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "websockets>=13.0",
    "flask>=3.0",
    "flask-cors>=4.0",
    "flask-limiter>=3.5",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "cryptography>=46.0.0",
    "pyotp>=2.9.0",
    "structlog>=24.1.0",
    "sentry-sdk[flask]>=2.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
