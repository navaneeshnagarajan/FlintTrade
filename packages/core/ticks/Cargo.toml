[package]
name = "tick-engine"
version = "0.2.0"
edition = "2021"
description = "High-performance tick-level backtesting simulator for FlintTrade"
license = "AGPL-3.0"

[lib]
name = "tick_engine"
# cdylib: Python extension module (maturin)
# rlib: required for `cargo test` on Windows (avoids python3xx.dll resolution)
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py312"] }
rayon = "1.10"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
