[project]
name = "flinttrade-core"
version = "0.0.1"
description = "Framework, OpenAlgo client (45+ endpoints), config, workspace, models, exceptions, auth"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "websockets>=13.0",
    "flask>=3.0",
    "flask-cors>=4.0",
    "flask-limiter>=3.5",
    "waitress>=3.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "cryptography>=46.0.0",
    "pyotp>=2.9.0",
    "structlog>=24.1.0",
    "sentry-sdk[flask]>=2.66.1",
    "numpy>=1.26.0",
    "duckdb~=1.4",
    "qrcode[svg]>=8.2",
    # health_monitor.check_thread_count + check_memory import psutil at
    # runtime. Without it those checks early-return "skipped" and the
    # _thread_baseline never gets set — see test_baseline_set_on_first_call.
    "psutil>=5.9",
    # Official Ollama Linux archives are .tar.zst. Keep decompression in-process
    # so a first-run install does not depend on a system `zstd`/`tar` binary.
    "zstandard>=0.23",
]

[project.scripts]
# Workspace CLI (init/status) and the Electron-managed source backend. Both
# become console entry points on ``pip install``.
flinttrade = "flinttrade_core.cli:main"
flinttrade-desktop-backend = "flinttrade_core.desktop:main"

[project.optional-dependencies]
# One-shot DuckDB→SQLite migration tooling (scripts/migrate-*-duckdb-to-sqlite.py).
# Heavy + migration-only, so kept out of the default install. Enable with:
#   uv sync --extra migration
migration = [
    "duckdb>=1.1",
    "pyarrow>=25.0.0",
    "pyrage>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
