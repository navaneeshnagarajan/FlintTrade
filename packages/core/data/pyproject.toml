[project]
name = "flinttrade-data"
version = "0.6.0-alpha"
description = "Tick recorder, audit logger (SEBI 5yr), trade logger, DuckDB storage, order analytics"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "duckdb~=1.4",
    "websockets>=13.0",
    "numpy>=1.26.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "flask>=3.0",
]

[project.optional-dependencies]
export = [
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "flinttrade_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
