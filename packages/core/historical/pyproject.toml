[project]
name = "flinttrade-historical"
version = "0.0.1"
description = "OHLCV downloader, free data sources (OpenChart/yfinance/jugaad), DuckDB pipeline, expiry manager"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "duckdb~=1.5",
    "flask>=3.0",
    "yfinance>=1.5.2",
    "jugaad-data>=0.31.0",
    "openchart>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_historical"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
