[project]
name = "flint-automation"
version = "0.5.0"
description = "Cron manager, Telegram bot with kill switch, n8n bridge, post-market analysis, WhatsApp alerter"
requires-python = ">=3.12"
dependencies = [
    "flint-core",
    "flint-ai",
    "httpx>=0.27.0",
    "flask>=3.0",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10.0",
    "pyotp>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
