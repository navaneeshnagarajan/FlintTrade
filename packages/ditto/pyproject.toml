[project]
name = "flint-ditto"
version = "0.5.0"
description = "Multi-account manager, position mirror, margin calculator, trailing SL, risk manager"
requires-python = ">=3.12"
dependencies = [
    "flint-core",
    "httpx>=0.27.0",
    "cryptography>=46.0.0",
    "numpy>=1.26.0",
    "numba>=0.59",
    "pydantic>=2.0",
]

[project.optional-dependencies]
numba = ["numba>=0.59"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
