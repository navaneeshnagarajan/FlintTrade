[package]
name = "tick-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance tick-level backtesting simulator for FlintTrade"
license = "AGPL-3.0"

[lib]
name = "tick_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["abi3-py312", "extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
