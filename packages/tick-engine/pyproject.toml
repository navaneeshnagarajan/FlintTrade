[build-system]
requires = ["maturin>=1.0,<2"]
build-backend = "maturin"

[project]
name = "tick-engine"
version = "0.1.0"
requires-python = ">=3.12"
description = "High-performance tick-level backtesting simulator for FlintTrade (Rust/PyO3)"
license = { text = "AGPL-3.0" }

[tool.maturin]
features = ["pyo3/abi3-py312"]
python-source = "python"
module-name = "tick_engine"
