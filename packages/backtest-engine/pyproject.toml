[project]
name = "flint-backtest-engine"
version = "0.5.0"
description = "Simulator, performance metrics (Sharpe/Sortino/DD), walk-forward, Monte Carlo, 101 strategies"
requires-python = ">=3.12"
dependencies = [
    "flint-core",
    "flint-engine",
    "flint-historical",
    "flint-indicators",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pydantic>=2.0",
    "flask>=3.0",
    "scipy>=1.12",
    "quantstats>=0.0.62",
]

[project.optional-dependencies]
vectorbt = ["vectorbt>=0.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "flint_backtest_engine"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
