[project]
name = "flint-data"
version = "0.5.0"
description = "Tick recorder, audit logger (SEBI 5yr), trade logger, DuckDB storage, order analytics"
requires-python = ">=3.12"
dependencies = [
    "flint-core",
    "duckdb>=1.0",
    "websockets>=13.0",
    "numpy>=1.26.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "flask>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "flint_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
