<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP is delivered as a per-request HTTP header by the FlintTrade gateway
         (flinttrade_core.csp / app.py _add_security_headers), NOT a <meta> tag.
         A per-render nonce is required so inline scripts are forbidden without an
         'unsafe-inline' allowance (DS-CSP-01), and only an HTTP header can carry a fresh
         nonce per response — a static <meta> cannot. The gateway weaves the nonce into
         both the policy and this file's <script> tags when it serves the built bundle.
         In `vite dev` there is no gateway and therefore no CSP; that is local-dev only,
         never the shipped app. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Preload critical fonts to eliminate FOIT -->
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <title>FlintTrade Terminal</title>
    <meta property="og:image" content="/logo.svg" />
    <meta property="og:title" content="FlintTrade" />
    <meta property="og:description" content="Open-source trading platform for Indian markets" />
    <!-- Fonts self-hosted via @fontsource (no external CDN, works offline) -->
  </head>
  <body style="background:#0a0a0f;color:#e4e4e7;font-family:'Inter',system-ui,sans-serif">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
