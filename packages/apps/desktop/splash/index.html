<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlintTrade</title>
    <style>
      :root {
        --bg: #0b0d12;
        --fg: #e6e8ee;
        --muted: #8b91a1;
        --accent: #ff6a3d;
        --accent-2: #ffb072;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(120% 80% at 50% 0%, rgba(255, 106, 61, 0.10), transparent 60%),
          var(--bg);
      }
      .mark {
        width: 56px;
        height: 56px;
        position: relative;
        display: grid;
        place-items: center;
      }
      .spark {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        transform: rotate(45deg);
        box-shadow: 0 0 24px rgba(255, 106, 61, 0.55);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(255, 106, 61, 0.18);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }
      .title {
        font-size: 19px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }
      .status {
        font-size: 12.5px;
        color: var(--muted);
        min-height: 16px;
      }
      .dot { animation: blink 1.4s infinite; }
      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse {
        0%, 100% { transform: rotate(45deg) scale(1); opacity: 1; }
        50% { transform: rotate(45deg) scale(0.82); opacity: 0.75; }
      }
      @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">
        <div class="ring"></div>
        <div class="spark"></div>
      </div>
      <div class="title">FlintTrade</div>
      <div class="status" id="status">
        Starting engine<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
      </div>
    </div>
  </body>
</html>
