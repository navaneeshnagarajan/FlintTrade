<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>FlintTrade</title>
    <link rel="stylesheet" href="./splash.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="mark">
        <div class="ring"></div>
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="FlintTrade">
          <!-- F letterform -->
          <rect x="3" y="3" width="5" height="26" rx="1" fill="var(--fg)" />
          <rect x="3" y="3" width="20" height="5" rx="1" fill="var(--fg)" />
          <rect x="3" y="13" width="14" height="5" rx="1" fill="var(--fg)" />
          <!-- Faceted flint spark -->
          <polygon points="24,1 29,6 24,11 21,7 24,5 21,3" fill="var(--accent)" />
          <polygon points="25,0 28,3 26,3 24,1" fill="var(--accent-2)" opacity="0.75" />
        </svg>
      </div>
      <div class="title">FlintTrade</div>
      <div class="phase" id="phase">Preparing</div>
      <div class="status" id="status" role="status" aria-live="polite">Preparing FlintTrade</div>
      <div
        class="progress"
        id="progress"
        role="progressbar"
        aria-label="FlintTrade startup progress"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="error" id="error" role="alert" aria-live="assertive">
        <div class="error-message" id="error-message"></div>
      </div>
      <div class="actions" id="actions">
        <button type="button" class="action secondary" id="cancel">Cancel</button>
        <button type="button" class="action primary" id="retry">Retry</button>
        <button type="button" class="action danger" id="quit">Quit FlintTrade</button>
        <div class="action-status" id="action-status" aria-live="polite"></div>
      </div>
    </div>
    <script src="./splash.js"></script>
  </body>
</html>
