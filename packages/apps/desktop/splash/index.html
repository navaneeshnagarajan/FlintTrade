<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlintTrade</title>
    <style>
      :root {
        --bg: #0b0d12;
        --fg: #e6e8ee;
        --muted: #8b91a1;
        /* Brand green — matches the design-system flint spark (#22c55e / #4ade80)
           and the terminal's Graphite accent, so the splash and the app are one
           continuous brand surface. */
        --accent: #22c55e;
        --accent-2: #4ade80;
        --error: #ff7a59;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(120% 80% at 50% 0%, rgba(34, 197, 94, 0.10), transparent 60%),
          var(--bg);
      }
      .mark {
        width: 64px;
        height: 64px;
        position: relative;
        display: grid;
        place-items: center;
      }
      /* The real FlintTrade flint mark (F letterform + faceted green spark),
         identical geometry to design-system/src/brand/Logo.tsx. */
      .mark svg {
        width: 44px;
        height: 44px;
        filter: drop-shadow(0 0 18px rgba(34, 197, 94, 0.45));
        animation: pulse 1.8s ease-in-out infinite;
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(34, 197, 94, 0.16);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }
      .title {
        font-size: 19px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }
      .status {
        font-size: 12.5px;
        color: var(--muted);
        min-height: 16px;
        max-width: 380px;
        text-align: center;
      }
      .dot { animation: blink 1.4s infinite; }
      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }
      /* First-run bootstrap: download progress for the backend payload. */
      .progress {
        width: 260px;
        height: 4px;
        border-radius: 999px;
        background: rgba(139, 145, 161, 0.18);
        overflow: hidden;
        display: none;
      }
      .progress.visible { display: block; }
      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 0.25s ease;
      }
      /* Bootstrap failure: actionable error state with a Retry button. */
      .error {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 380px;
        text-align: center;
      }
      .error.visible { display: flex; }
      .error-message {
        font-size: 12.5px;
        color: var(--error);
        line-height: 1.5;
      }
      .retry {
        min-height: 34px;
        padding: 0 20px;
        border: 1px solid rgba(34, 197, 94, 0.4);
        border-radius: 6px;
        background: rgba(34, 197, 94, 0.12);
        color: var(--fg);
        font: 600 12.5px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        cursor: pointer;
      }
      .retry:hover { background: rgba(34, 197, 94, 0.2); }
      .retry:disabled { opacity: 0.6; cursor: wait; }
      body.errored .ring {
        animation-play-state: paused;
        border-top-color: var(--error);
      }
      body.errored .mark svg { animation-play-state: paused; }
      body.errored .status { display: none; }
      body.errored .progress { display: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.82; }
      }
      @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">
        <div class="ring"></div>
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="FlintTrade">
          <!-- F letterform -->
          <rect x="3" y="3" width="5" height="26" rx="1" fill="var(--fg)" />
          <rect x="3" y="3" width="20" height="5" rx="1" fill="var(--fg)" />
          <rect x="3" y="13" width="14" height="5" rx="1" fill="var(--fg)" />
          <!-- Faceted flint spark -->
          <polygon points="24,1 29,6 24,11 21,7 24,5 21,3" fill="var(--accent)" />
          <polygon points="25,0 28,3 26,3 24,1" fill="var(--accent-2)" opacity="0.75" />
        </svg>
      </div>
      <div class="title">FlintTrade</div>
      <div class="status" id="status">
        Starting engine<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
      </div>
      <div class="progress" id="progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="error" id="error">
        <div class="error-message" id="error-message"></div>
        <button type="button" class="retry" id="retry">Retry</button>
      </div>
    </div>
    <script>
      // First-run bootstrap progress. The shell emits "bootstrap://status"
      // events ({phase, pct, message}) while it downloads and verifies the
      // backend payload; this page renders them and offers a Retry action
      // when an attempt fails. Dependency-free: it talks to Tauri through
      // window.__TAURI_INTERNALS__ only (like the recovery page does).
      (function () {
        var internals = window.__TAURI_INTERNALS__;
        var statusEl = document.getElementById("status");
        var progressEl = document.getElementById("progress");
        var fillEl = document.getElementById("progress-fill");
        var errorEl = document.getElementById("error");
        var errorMessageEl = document.getElementById("error-message");
        var retryEl = document.getElementById("retry");
        if (!internals || !statusEl || !progressEl || !fillEl || !errorEl || !errorMessageEl || !retryEl) {
          return;
        }
        var sawLiveEvent = false;

        function showStatus(message) {
          document.body.classList.remove("errored");
          errorEl.classList.remove("visible");
          statusEl.textContent = message;
        }

        function showError(message) {
          document.body.classList.add("errored");
          errorMessageEl.textContent = message || "The trading engine could not be prepared.";
          errorEl.classList.add("visible");
          retryEl.disabled = false;
        }

        function render(status) {
          if (!status || typeof status.phase !== "string") {
            return;
          }
          if (status.phase === "error") {
            showError(status.message);
            return;
          }
          showStatus(status.message || "Starting engine");
          if (typeof status.pct === "number") {
            progressEl.classList.add("visible");
            fillEl.style.width = Math.max(0, Math.min(100, status.pct)) + "%";
          }
          if (status.phase === "starting") {
            progressEl.classList.remove("visible");
          }
        }

        retryEl.addEventListener("click", function () {
          retryEl.disabled = true;
          showStatus("Retrying...");
          internals.invoke("retry_bootstrap").catch(function (error) {
            showError(String(error));
          });
        });

        internals
          .invoke("plugin:event|listen", {
            event: "bootstrap://status",
            target: { kind: "Any" },
            handler: internals.transformCallback(function (event) {
              sawLiveEvent = true;
              render(event && event.payload);
            })
          })
          .then(function () {
            // Catch up on any status emitted before this listener existed.
            return internals.invoke("bootstrap_status");
          })
          .then(function (status) {
            if (status && !sawLiveEvent) {
              render(status);
            }
          })
          .catch(function () {
            // Leave the default "Starting engine..." status in place.
          });
      })();
    </script>
  </body>
</html>
