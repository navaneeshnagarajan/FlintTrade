[package]
name = "flinttrade-desktop"
version = "0.6.0-beta.7"
description = "FlintTrade native desktop application"
authors = ["FlintTrade"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri keeps the app logic in a library so the same crate can target desktop
# and (future) mobile. ``main.rs`` is a thin shim that calls ``run()``.
name = "flinttrade_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ``tray-icon`` powers the background-runtime tray (close-to-tray keeps the
# backend + autonomous agent alive when the window is closed).
tauri = { version = "2", features = ["tray-icon"] }
# Global hotkey to summon/hide the window from anywhere (trader quick-access).
tauri-plugin-global-shortcut = "2"
# Native OS notifications for backend-emitted events (trade fills, safety-gate
# blocks, agent turn-finished) — raised from Rust so they fire even when the
# window is hidden and the AI agent is running headless in the background.
tauri-plugin-notification = "2"
# System-browser opener for broker OAuth approval pages. The desktop webview has
# no window.open handler, so the terminal invokes plugin:opener|open_url (scoped
# to https URLs in capabilities/default.json) to launch the default browser.
tauri-plugin-opener = "2"
# Signed one-click updates from the rolling GitHub updater feed
# (releases/download/updater-<channel>/latest.json). The webview never calls
# the plugin directly — it reaches it only through the check_native_update /
# apply_native_update commands granted in capabilities/main-remote.json.
tauri-plugin-updater = "2"
# Managed backend-payload downloads (check_payload_update /
# apply_payload_update): streams the frozen backend from the rolling channel
# release into <workspace>/runtime/backend/. The feature mirrors
# tauri-plugin-updater's reqwest configuration, so both share the one
# reqwest/rustls build already resolved in the lockfile.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
tokio = { version = "1", features = ["time"] }        # stall watchdog on the payload download stream
# The no-provider rustls stack needs a process-wide crypto provider; ring is
# the provider the updater plugin already uses (installed lazily in
# ``payload_http_client`` exactly as the plugin does).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Streaming sha256 pin for downloaded backend payloads plus the boot-time
# re-verification of the staged binary against ``state.json``.
sha2 = "0.10"
# Prerelease-aware version ordering so the boot path can tell when the
# installed backend payload predates this shell (DMG upgraded, payload not)
# and upgrade it from the channel manifest. Already resolved in the lockfile
# via tauri.
semver = "1"
# Cross-platform CSPRNG for provisioning the credential-vault master password
# on first launch (loopback, single-user desktop).
getrandom = "0.2"
# Cross-platform advisory kernel locks for one desktop shell per workspace. The
# open lock file is held in Tauri managed state for the process lifetime; its
# text is diagnostic only and never participates in ownership decisions.
fs2 = "0.4"
# Serialising the ``updater_state`` command payload over Tauri IPC. Already in
# the dependency graph via tauri itself, so this adds no supply-chain weight.
serde = { version = "1", features = ["derive"] }
# ``tauri::generate_context!`` references ``serde_json`` from the crate root
# once a ``plugins`` config block exists (the updater config above). Also
# already in the dependency graph via tauri itself.
serde_json = "1"

[features]
# This feature is used to enable the production custom-protocol asset server in
# release builds; Tauri's CLI injects it.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
# Temporary until plist publishes a release that accepts quick-xml >=0.41.0.
# The vendored source is plist 1.9.0 with only the quick-xml dependency bumped
# to clear RUSTSEC-2026-0194 in the Tauri desktop lockfile.
plist = { path = "../../../../supply-chain/vendor/plist-1.9.0" }

[profile.release]
panic = "abort"     # smaller binary; we never unwind across the FFI boundary
codegen-units = 1
lto = true
opt-level = "s"
strip = true
