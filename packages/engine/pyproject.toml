[project]
name = "flint-engine"
version = "0.5.0"
description = "5-layer safety system, order router, scheduler, strategy registry, position sizer, sandbox executor"
requires-python = ">=3.12"
dependencies = [
    "flint-core",
    "flint-data",
    "pydantic>=2.0",
    "flask>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
