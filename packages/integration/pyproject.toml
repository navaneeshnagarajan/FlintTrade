[project]
name = "flint-integration"
version = "0.5.0"
description = "TradingView webhooks, ChartInk, custom webhooks, flow builder, Excel bridge, voice orders"
requires-python = ">=3.12"
dependencies = [
    "flint-core",
    "flint-automation",
    "flask>=3.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
