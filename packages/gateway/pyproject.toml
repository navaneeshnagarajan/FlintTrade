[project]
name = "flint-gateway"
version = "0.5.0"
description = "Direct broker connections (33 brokers), adapter pattern, encrypted credentials, WebSocket bridge"
requires-python = ">=3.12"
dependencies = [
    "flint-core",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "cryptography>=46.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "flint_gateway"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src", "../.."]
