[project]
name = "flint-gateway"
version = "0.5.1"
description = "Direct broker connections (33 brokers), adapter pattern, encrypted credentials, WebSocket bridge"
requires-python = ">=3.12"
dependencies = [
    "flint-core",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "cryptography>=46.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "flint_gateway"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
pythonpath = ["src", "../.."]
