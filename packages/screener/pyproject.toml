[project]
name = "flint-screener"
version = "0.5.0"
description = "Option chain, OI analysis, PCR, max pain, portfolio Greeks, IV surface, market scanner"
requires-python = ">=3.12"
dependencies = [
    "flint-core",
    "flint-indicators",
    "numpy>=1.26.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "flask>=3.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
greeks = [
    "py-vollib-vectorized>=0.1",
    "mibian>=0.1",
]
nse = [
    "nsepython>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "flint_screener"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
