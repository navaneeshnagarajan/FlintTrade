[project]
name = "flinttrade-engine"
version = "0.6.0-beta.5"
description = "5-layer safety system, order router, scheduler, strategy registry, position sizer, sandbox executor"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "flinttrade-data",
    "pydantic>=2.0",
    "flask>=3.0",
    "duckdb~=1.4",
    "watchdog>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
