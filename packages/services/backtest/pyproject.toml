[project]
name = "flinttrade-backtest"
version = "0.6.0-beta.2"
description = "Simulator, performance metrics (Sharpe/Sortino/DD), walk-forward, Monte Carlo, 101 strategies"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "flinttrade-screener",
    "flinttrade-engine",
    "flinttrade-historical",
    "flinttrade-indicators",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pydantic>=2.0",
    "flask>=3.0",
    "scipy>=1.12",
    "quantstats>=0.0.62",
]

[project.optional-dependencies]
vectorbt = ["vectorbt>=0.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_backtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
