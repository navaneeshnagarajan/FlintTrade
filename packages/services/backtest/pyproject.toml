[project]
name = "flinttrade-backtest"
version = "0.0.1"
description = "Simulator, performance metrics (Sharpe/Sortino/DD), walk-forward, Monte Carlo, 94 strategy template modules"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "flinttrade-screener",
    "flinttrade-engine",
    "flinttrade-historical",
    "flinttrade-indicators",
    "numpy==2.5.4",
    "pandas==2.3.3",
    "pydantic==2.14.1",
    "flask==3.1.3",
    "scipy==1.18.1",
    "quantstats==0.0.86",
]

[project.optional-dependencies]
vectorbt = ["vectorbt==1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_backtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
