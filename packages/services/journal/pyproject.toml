[project]
name = "flinttrade-journal"
version = "0.6.0-beta.13"
description = "Trade journal, trade logging, execution analytics, and P&L tracking"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "flinttrade-data",
    "duckdb~=1.4",
    "flask>=3.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_journal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
