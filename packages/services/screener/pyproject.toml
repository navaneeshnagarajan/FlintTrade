[project]
name = "flinttrade-screener"
version = "0.0.1"
description = "Option chain, OI analysis, PCR, max pain, portfolio Greeks, IV surface, market scanner"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "flinttrade-indicators",
    "numpy==2.5.4",
    "pydantic==2.14.0",
    "httpx==0.28.1",
    "flask==3.1.3",
    "duckdb==1.5.6",
]

[project.optional-dependencies]
greeks = [
    "py-vollib-vectorized==0.1.1",
    "mibian==0.1.3",
]
nse = [
    "nsepython==2.101",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
