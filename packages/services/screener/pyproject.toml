[project]
name = "flinttrade-screener"
version = "0.6.0-beta.5"
description = "Option chain, OI analysis, PCR, max pain, portfolio Greeks, IV surface, market scanner"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "flinttrade-indicators",
    "numpy>=1.26.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "flask>=3.0",
    "duckdb~=1.4",
]

[project.optional-dependencies]
greeks = [
    "py-vollib-vectorized>=0.1",
    "mibian>=0.1",
]
nse = [
    "nsepython>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
