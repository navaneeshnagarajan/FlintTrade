[project]
name = "flinttrade-automation"
version = "0.0.1"
description = "Cron manager, Telegram bot with kill switch, post-market analysis, voice orders"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "flinttrade-ai",
    "httpx>=0.27.0",
    "flask>=3.0",
    "apscheduler>=3.11.3",
    "pyotp>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
