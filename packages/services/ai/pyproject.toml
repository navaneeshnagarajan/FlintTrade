[project]
name = "flinttrade-ai"
version = "0.6.0-alpha"
description = "LLM client (multi-provider), RAG (ChromaDB), signals, sentiment, MCP bridge, swarm executor"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "flinttrade-indicators",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "flask>=3.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "joblib>=1.3",
    "feedparser>=6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "scipy>=1.12",
]
scraping = ["crawl4ai>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "flinttrade_ai"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
