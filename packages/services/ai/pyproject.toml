[project]
name = "flinttrade-ai"
version = "0.0.1"
description = "LLM client (multi-provider), optional RAG, signals, sentiment, MCP bridge, swarm executor"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "flinttrade-screener",
    "flinttrade-indicators",
    "httpx==0.28.1",
    "pydantic==2.14.0",
    "flask==3.1.3",
    "numpy==2.5.4",
    "pandas==2.3.3",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
    "joblib==1.6.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
ml = [
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    # Hyper-parameter optimisation for the strategy tuner (hyperopt_strategy.py).
    "optuna==5.0.0",
]
# PDF support for the canonical RAG pipeline.
rag = [
    "pypdf==6.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
