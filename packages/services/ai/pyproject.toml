[project]
name = "flinttrade-ai"
version = "0.0.1"
description = "LLM client (multi-provider), optional RAG, signals, sentiment, MCP bridge, swarm executor"
requires-python = ">=3.12"
dependencies = [
    "flinttrade-core",
    "flinttrade-screener",
    "flinttrade-indicators",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "flask>=3.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "joblib>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "scipy>=1.18.0",
    # Hyper-parameter optimisation for the ensemble/strategy tuners
    # (hyperopt_strategy.py, ensemble_selector.py).
    "optuna>=3.6",
]
# ChromaDB-backed canonical RAG pipeline + agent memory.
rag = [
    "chromadb>=0.5",
    "pypdf>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flinttrade_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast, isolated unit test (default; runs on every commit)",
    "integration: touches DB or mocked external services (PR gate)",
    "slow: long-running test >1s (nightly or via --run-slow)",
]
