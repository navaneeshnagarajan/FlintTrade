<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlintTrade</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">&#9670;</span>
        <span class="logo-text">FlintTrade</span>
      </div>
      <div id="connection-status" class="status disconnected">
        <span class="status-dot"></span>
        <span class="status-text">Disconnected</span>
      </div>
    </header>

    <!-- Settings (collapsed by default) -->
    <div id="settings-section" class="section settings-collapsed">
      <button id="settings-toggle" class="settings-toggle-btn">
        Settings &#9662;
      </button>
      <div id="settings-form" class="settings-form hidden">
        <label>
          <span>FlintTrade Host</span>
          <input type="text" id="host-input" placeholder="http://localhost:5173" />
        </label>
        <label>
          <span>API Key</span>
          <input type="password" id="apikey-input" placeholder="Your API key" />
        </label>
        <button id="save-settings" class="btn btn-secondary">Save</button>
      </div>
    </div>

    <!-- Quick Order Form -->
    <div class="section">
      <h3>Quick Order</h3>
      <form id="order-form">
        <label>
          <span>Symbol</span>
          <input type="text" id="symbol-input" placeholder="e.g. NIFTY" required />
        </label>
        <label>
          <span>Exchange</span>
          <select id="exchange-input">
            <option value="NSE">NSE</option>
            <option value="BSE">BSE</option>
            <option value="NFO">NFO</option>
            <option value="MCX">MCX</option>
            <option value="CDS">CDS</option>
          </select>
        </label>
        <label>
          <span>Quantity</span>
          <input type="number" id="qty-input" placeholder="1" min="1" value="1" required />
        </label>
        <div class="btn-row">
          <button type="button" id="buy-btn" class="btn btn-buy">BUY</button>
          <button type="button" id="sell-btn" class="btn btn-sell">SELL</button>
        </div>
      </form>
      <div id="order-result" class="result hidden"></div>
    </div>

    <!-- Recent Signals -->
    <div class="section">
      <h3>Recent Signals</h3>
      <div id="signals-list" class="signals-list">
        <p class="muted">Connect to FlintTrade to view signals</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
