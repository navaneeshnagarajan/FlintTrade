[package]
name = "flinttrade-desktop"
version = "0.5.2-dev"
description = "FlintTrade native desktop application"
authors = ["FlintTrade"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "flinttrade_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# OS keychain (cross-platform: Windows Credential Manager, macOS Keychain, libsecret on Linux)
keyring = "3"

# HTTP server (webhook receiver)
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (webhook forwarding to FlintTrade backend)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date / time (IST calculations)
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrency
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
