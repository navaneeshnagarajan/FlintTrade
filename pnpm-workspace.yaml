packages:
  - packages/core/design-system
  - packages/apps/terminal
  - packages/apps/site
  - packages/apps/desktop

strictPeerDependencies: true
autoInstallPeers: false
saveExact: true
auditLevel: high
verifyStoreIntegrity: true
fund: false

# Dependency build scripts.
#
# pnpm 9 runs every dependency lifecycle script. pnpm 10 stopped doing that
# unless the package is allowlisted here, and pnpm 11 turns an un-allowlisted
# build script into a hard ERR_PNPM_IGNORED_BUILDS failure. Declaring the
# allowlist now is inert under pnpm 9 and makes the eventual upgrade a no-op
# instead of a silent loss of the esbuild and electron-winstaller builds.
#
# NOTE: this block needs pnpm >= 10.26.0. Earlier 10.x releases ignore it
# SILENTLY - the install still exits 0 while building nothing - so any pnpm 10
# pin below 10.26.0 would look green while enforcing nothing.
allowBuilds:
  # esbuild ships its platform binary as an optional dependency; the postinstall
  # re-validates it. Required by the terminal's vite build.
  esbuild: true
  # Copies vendor/7z-<arch>.{exe,dll} to vendor/7z.{exe,dll} for Squirrel.Windows.
  # The tarball ships only the per-arch names, so this script is the only thing
  # that produces the ones the packager opens. Required by desktop-package.
  electron-winstaller: true
  # A donation notice that already swallows its own failure. Denied explicitly
  # so pnpm 11 does not fail the install over it.
  es5-ext: false

peerDependencyRules:
  allowedVersions:
    '@glideapps/glide-data-grid>marked': '18'
    '@napi-rs/wasm-runtime>@emnapi/core': '1'
    '@napi-rs/wasm-runtime>@emnapi/runtime': '1'

# These MUST stay byte-identical to the "pnpm.overrides" block in package.json
# until that block is removed, because the two files disagree about who wins:
# pnpm 9 and 10 read package.json and ignore this block, while pnpm 11 ignores
# the package.json "pnpm" field entirely and reads only this one. An earlier
# revision of this file had drifted - it pinned hono 4.12.25, js-yaml 4.2.0 and
# postcss 8.5.15, and omitted eight entries including every brace-expansion
# selector - so a pnpm 11 upgrade would have silently downgraded three packages
# and dropped the security pins below.
#
# brace-expansion overrides (GHSA-mh99-v99m-4gvg, advisory range <=5.0.7): the
# selectors below cover EVERY vulnerable range, not just the ones the tree
# happens to resolve today, so a future transitive copy cannot silently
# reintroduce the flaw behind the audit allowlist entry.
# Patched releases per major line: 2.1.3 (dist-tag maintenance-v2), 3.0.5
# (maintenance-v3), 5.0.8 (latest). 1.x has no patched release of its own, so it
# is pulled onto 2.1.3, which keeps the callable CommonJS default export that
# minimatch 3.x/5.x/9.x require.
# The 4.x line is the exception: npm publishes only 4.0.0 and 4.0.1, both inside
# the advisory range, and there is no maintenance-v4 dist-tag - no patched 4.x
# exists. It is therefore mapped to 3.0.5, the newest patched release that keeps
# 4.x's API: 3.x and 4.x are both ESM-only with the same `export default
# expandTop` shape (3.x additionally accepts an options argument), and the only
# 3.0.4 -> 4.0.1 change is an internal split/join -> regex refactor. 5.0.8 is NOT
# usable there: 5.x replaced the default export with a named `expand`.
# Verify a target exists before pinning to it: npm view brace-expansion@<version> version
overrides:
  '@babel/core': 7.29.6
  '@hono/node-server': 2.0.10
  'body-parser@>=2.0.0 <2.3.0': 2.3.0
  'brace-expansion@<2.0.0': 2.1.3
  'brace-expansion@>=2.0.0 <2.1.3': 2.1.3
  'brace-expansion@>=3.0.0 <3.0.5': 3.0.5
  'brace-expansion@>=4.0.0 <5.0.0': 3.0.5
  'brace-expansion@>=5.0.0 <5.0.8': 5.0.8
  esbuild: 0.28.1
  fast-uri: 4.1.1
  hono: 4.12.27
  js-yaml: 4.3.0
  postcss: 8.5.23
  sharp: 0.35.3
  undici: 7.28.0
